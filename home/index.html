<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111318">
<title>Eli HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#16181d;--muted:#6b6f78;--line:#e6e2da;--soft:#f8f6f2;
--zug:#232f3e;--zug2:#ff9900;--sesa:#1d1d1f;--sesa2:#F07C8C;--zalo:#173d2c;--zalo2:#3fbf7f;--plumb:#0b1f33;--plumb2:#4aa3ff;--brief:#4b2a7b;--brief2:#b18cff;--admin:#3a3f47;--admin2:#9aa3ae;
--ok:#1f9d5a;--okbg:#e5f5ec;--warn:#c47a00;--warnbg:#fff3df;--off:#8a8f98;--offbg:#eef0f2;--one:#2f6fd6;--onebg:#e6eefc;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eef0f3;--muted:#9aa0aa;--line:#262a32;--soft:#1d2027;--okbg:#14301f;--warnbg:#33270f;--offbg:#23262d;--onebg:#172540;--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 10%,#2a2f3a 0,#111318 55%)}
.gbox{width:100%;max-width:360px;color:#fff;text-align:center}
.mark{font-weight:800;font-size:34px;letter-spacing:-1px}
.mark i{font-style:normal;color:var(--zug2)}
.gbox p{color:#aab0bb;margin:6px 0 26px}
.gbox input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid #333a46;background:#1a1e26;color:#fff;font:inherit;font-size:16px;outline:none}
.gbox input:focus{border-color:var(--zug2)}
.gbox button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:var(--zug2);color:#16181d;font-weight:700;font-size:16px}
.err{color:#ff8a8a;font-size:14px;margin-top:12px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* app */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top .mark{font-size:22px;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;margin-left:auto}
.tabs button{border:0;background:none;color:var(--muted);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;min-height:38px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.lo{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:13px;min-height:38px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;letter-spacing:-.5px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
/* hub tiles */
.tiles{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;border-radius:22px;padding:20px;min-height:200px;color:#fff;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.98)}
@media(hover:hover){.tile:hover{transform:translateY(-3px)}}
.tile:before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:var(--a2);opacity:.22}
.tile .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.tile .n{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.tile .n b{width:10px;height:10px;border-radius:50%;background:var(--a2);display:inline-block}
.tile .h{font-size:14px;opacity:.92;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .st{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tile .st span{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.tile .go{position:absolute;right:18px;bottom:18px;width:40px;height:40px;border-radius:50%;background:var(--a2);color:#111;display:flex;align-items:center;justify-content:center}
.t-zug{background:linear-gradient(140deg,#232f3e,#131921);--a2:var(--zug2)}
.t-sesa{background:linear-gradient(140deg,#2a2a2d,#141416);--a2:var(--sesa2)}
.t-zalo{background:linear-gradient(140deg,#1d4a35,#0f2a1e);--a2:var(--zalo2)}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(min-width:760px){.mini{grid-template-columns:repeat(4,1fr)}}
.mtile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;min-height:92px;box-shadow:var(--shadow)}
.mtile .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.mtile b{font-size:15px}.mtile small{color:var(--muted);font-size:12.5px}
.sec{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
/* agents */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.stat.g .v{color:var(--ok)}
.now{background:linear-gradient(120deg,#1a1e26,#262b36);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:center}
.now .dot{flex:none}
.now b{display:block;font-size:15px}.now small{color:#aab0bb;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;min-height:40px;display:flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{margin-top:18px}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.gh .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
.gh b{font-size:17px}.gh small{color:var(--muted);margin-left:auto;font-size:13px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
.ag{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 18px;box-shadow:var(--shadow);overflow:hidden;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.ag:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.ag.paused{opacity:.62}.ag.paused:before{background:var(--off)}
.ag .r1{display:flex;align-items:center;gap:8px}
.ag .nm{font-weight:700;font-size:15px;flex:1}
.ag .wh{color:var(--muted);font-size:13.5px;margin:4px 0 10px}
.ag .r2{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 9px;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--warnbg);color:var(--warn)}.pill.one{background:var(--onebg);color:var(--one)}.pill.off{background:var(--offbg);color:var(--off)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.dot.live:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:pulse 2s infinite;opacity:0}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.dot.off{background:var(--off)}.dot.one{background:var(--one)}.dot.run{background:var(--zug2)}
.dot.run:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--zug2);animation:pulse 1.2s infinite}
.timeline{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:6px}
.tl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tl:last-child{border-bottom:0}
.tl time{font-weight:700;width:58px;flex:none;font-variant-numeric:tabular-nums}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tl span{flex:1}
/* team map */
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.mapwrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;
 background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
#tmap{display:block;width:100%;touch-action:manipulation}
#tmap .cl rect{fill:var(--card);stroke:var(--line)}
#tmap .cl text{font:700 12px Poppins,sans-serif;letter-spacing:.06em;text-transform:uppercase}
#tmap .ed{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:3 7;opacity:.42;animation:flow 1.1s linear infinite;transition:opacity .25s,stroke-width .25s}
@keyframes flow{to{stroke-dashoffset:-20}}
#tmap .ed.hot{opacity:1;stroke-width:3.4;animation-duration:.55s}
#tmap.sel .ed{opacity:.08}#tmap.sel .ed.hot{opacity:1}
#tmap.sel .nd{opacity:.28}#tmap.sel .nd.hot{opacity:1}
#tmap .nd{cursor:pointer;transition:opacity .25s}
#tmap .nd text{font:600 10.5px Poppins,sans-serif;fill:var(--ink)}
#tmap .nd .ring{fill:none;stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
#tmap .nd.live .ring{animation:ring 2.4s infinite}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
#tmap .eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#tmap .bub rect{fill:#16181d}#tmap .bub text{font:600 11px Poppins,sans-serif;fill:#fff}
#tmap .bub{animation:pop .3s both}@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.zz{opacity:.55}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;box-shadow:var(--shadow);animation:up .25s both}
.panel h3{margin:0;font-size:17px}.panel .wh{color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.msg{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.msg .av{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font:700 10px Poppins,sans-serif}
.msg .bb{background:var(--soft);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 11px;font-size:13.5px}
.msg .bb b{font-size:12px;color:var(--muted);display:block;font-weight:600}
.msg.me{flex-direction:row-reverse}.msg.me .bb{border-radius:14px 4px 14px 14px;background:var(--okbg);border-color:transparent}
.chat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-top:12px;box-shadow:var(--shadow)}
.chat .msg{animation:up .35s both}
.hint{color:var(--muted);font-size:12.5px;text-align:center;margin:8px 0 0}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div id="gate" class="gate">
 <div class="gbox">
  <div class="mark">Eli<i>.</i>HQ</div>
  <p>One login for Zugati, Sesa and Zalo</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">Open</button>
  <div id="err" class="err hidden">Wrong password - try again.</div>
 </div>
</div>

<div id="app" class="hidden">
 <header class="top"><div class="in">
  <div class="mark">Eli<i style="font-style:normal;color:var(--zug2)">.</i>HQ</div>
  <nav class="tabs"><button id="tb-hubs" class="on" onclick="show('hubs')">Hubs</button><button id="tb-agents" onclick="show('agents')">Agents</button></nav>
  <button class="lo" onclick="logout()" aria-label="Log out">Log out</button>
 </div></header>
 <main>
  <section id="v-hubs"></section>
  <section id="v-agents" class="hidden"></section>
  <div class="foot" id="foot"></div>
 </main>
</div>

<script>
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WEEK=6048e5;
async function deriveKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function openBox(e,pw){const k=await deriveKey(pw,b64(e.salt),e.iter);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},k,b64(e.ct));return new TextDecoder().decode(p)}
async function getJ(u){const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(u);return r.json()}
function remPw(k){try{const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&o.pw&&Date.now()-o.t<WEEK){o.t=Date.now();localStorage.setItem(k,JSON.stringify(o));return o.pw}localStorage.removeItem(k)}catch(e){}return null}
function savePw(k,pw){try{localStorage.setItem(k,JSON.stringify({pw:pw,t:Date.now()}))}catch(e){}}

let KEYS=null,AG=null,FILTER='all',VIEW='team',SEL=null,TALK=null;
const BIZ={
 brief:{n:'Daily briefs',c:'#7b4fd0',ic:'M12 3v2m0 14v2M5 12H3m18 0h-2M6.3 6.3 4.9 4.9m14.2 14.2-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'},
 zugati:{n:'Zugati Amazon',c:'#ff9900',ic:'M3 6h18l-2 12H5L3 6zm5 0a4 4 0 0 1 8 0'},
 web:{n:'Zugati website',c:'#e06c9f',ic:'M4 5h16v11H4zM8 20h8M12 16v4'},
 sesa:{n:'Sesa Estates',c:'#F07C8C',ic:'M3 11l9-7 9 7v9H3zM9 20v-6h6v6'},
 zalo:{n:'Zalo Estates',c:'#2fae6e',ic:'M3 11l9-7 9 7v9H3zM10 20v-5h4v5'},
 plumb:{n:'Plumb Rescue 24',c:'#3b8eea',ic:'M14 3l7 7-4 4-7-7zM10 7 3 14v7h7l7-7'},
 admin:{n:'Inbox and admin',c:'#8a94a3',ic:'M3 6h18v12H3zM3 7l9 6 9-6'}
};
const ORDER=['brief','zugati','web','sesa','zalo','plumb','admin'];
const svg=(d,s=18,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

async function go(){
 const pw=$('pw').value;$('err').classList.add('hidden');
 try{
  KEYS=JSON.parse(await openBox(await getJ('keys.enc.json'),pw));
  savePw('eliHome',pw);try{sessionStorage.setItem('eliHomePw',pw)}catch(e){}
  // fill every hub's own remember slot so they open without asking (7 days, same as before)
  savePw('zugatiRemember',KEYS.zugati);savePw('sesaRemember',KEYS.sesa);savePw('zaloRemember',KEYS.zalo);
  try{sessionStorage.setItem('zpw',KEYS.zugati);sessionStorage.setItem('sesaPw',KEYS.sesa);sessionStorage.setItem('zaloPw',KEYS.zalo)}catch(e){}
  $('gate').classList.add('hidden');$('app').classList.remove('hidden');
  hubs();agents(pw);show(location.hash==='#agents'?'agents':'hubs');
 }catch(e){console.error(e);try{localStorage.removeItem('eliHome')}catch(x){}$('err').classList.remove('hidden');const g=$('pw');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}
}
function logout(){['eliHome','zugatiRemember','sesaRemember','zaloRemember'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});try{sessionStorage.clear()}catch(e){}location.hash='';location.reload()}
function show(v){['hubs','agents'].forEach(x=>{$('v-'+x).classList.toggle('hidden',x!==v);$('tb-'+x).classList.toggle('on',x===v)});history.replaceState(null,'',v==='agents'?'#agents':'#');window.scrollTo(0,0);if(v==='agents'&&AG)drawAgents()}

function ago(t){if(!t)return '';const m=Math.round((Date.now()-new Date(t))/6e4);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';const d=Math.round(h/24);return d+(d===1?' day ago':' days ago')}
function when(t){if(!t)return '';const d=new Date(t),n=new Date();const tm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});const day=(x)=>x.toLocaleDateString('en-GB',{timeZone:'Europe/London'});const tmr=new Date(n.getTime()+864e5);
 if(day(d)===day(n))return 'today '+tm;if(day(d)===day(tmr))return 'tomorrow '+tm;return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/London'})+' '+tm}
const gbp=n=>'£'+Math.round(n).toLocaleString('en-GB');

async function hubs(){
 const h=new Date().toLocaleString('en-GB',{hour:'numeric',hour12:false,timeZone:'Europe/London'});
 const hi=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 $('v-hubs').innerHTML=`<h1>${hi}, Eli</h1><p class="sub">Tap a hub - you're already logged in to all three.</p>
 <div class="tiles">
  <a class="tile t-zug" href="../"><div class="k">Amazon</div><div class="n"><b></b>Zugati</div><div class="h" id="h-zug">Loading...</div><div class="st" id="s-zug"></div><div class="go">${svg('M5 12h14M13 6l6 6-6 6')}</div></a>
  <a class="tile t-sesa" href="../sesa/"><div class="k">Property</div><div class="n"><b></b>Sesa Estates</div><div class="h" id="h-sesa">Loading...</div><div class="st" id="s-sesa"></div><div class="go">${svg('M5 12h14M13 6l6 6-6 6')}</div></a>
  <a class="tile t-zalo" href="../zalo/"><div class="k">Property</div><div class="n"><b></b>Zalo Estates</div><div class="h" id="h-zalo">Loading...</div><div class="st" id="s-zalo"></div><div class="go">${svg('M5 12h14M13 6l6 6-6 6')}</div></a>
 </div>
 <div class="sec">More</div>
 <div class="mini">
  <a class="mtile" href="#agents" onclick="show('agents');return false"><div class="ic" style="background:#7b4fd022;color:#7b4fd0">${svg('M12 2a4 4 0 0 1 4 4v2H8V6a4 4 0 0 1 4-4zM4 10h16v10H4zM9 15h.01M15 15h.01')}</div><b>Agents</b><small id="m-ag">Your live agents</small></a>
  <a class="mtile" href="https://www.zugati.co.uk/admin" target="_blank" rel="noopener"><div class="ic" style="background:#e06c9f22;color:#e06c9f">${svg('M4 5h16v11H4zM8 20h8M12 16v4')}</div><b>Zugati shop</b><small>Website back end</small></a>
  <a class="mtile" href="https://www.zugati.co.uk/" target="_blank" rel="noopener"><div class="ic" style="background:#ff990022;color:#c47a00">${svg('M3 6h18l-2 12H5L3 6zm5 0a4 4 0 0 1 8 0')}</div><b>zugati.co.uk</b><small>Live shop</small></a>
  <a class="mtile" href="../hub/"><div class="ic" style="background:#2fae6e22;color:#2fae6e">${svg('M16 11a4 4 0 1 0-8 0M3 21a9 9 0 0 1 18 0')}</div><b>Partner logins</b><small>Eli Hub (Samuel, Eli S)</small></a>
 </div>`;
 // live peeks - each one is optional
