<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sesa Estates Hub</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6a66;--line:#e6e4de;--pink:#F07C8C;
--red:#c2412d;--redbg:#fbe9e5;--amb:#9a6200;--ambbg:#fbf1dc;--grn:#2f7a3b;--grnbg:#e7f3e8;--blue:#245fa8;--bluebg:#e6effa}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f2f1ee;--muted:#a3a19b;--line:#2e2d2a;
--redbg:#3a1d17;--red:#f0907c;--ambbg:#3a2c10;--amb:#f2c063;--grnbg:#173020;--grn:#8fd49b;--bluebg:#16263b;--blue:#8db8ee}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Poppins,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 60px}
.logo{background:#1D1D1F;color:#fff;border-radius:14px;padding:18px 18px 14px;margin-bottom:14px}
.logo b{font-size:22px;letter-spacing:4px;font-weight:700}.logo b i{color:var(--pink);font-style:normal}
.logo small{display:block;letter-spacing:5px;font-size:11px;color:#bbb;margin-top:2px}
.logo .up{font-size:12px;color:#aaa;margin-top:10px;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{font-size:18px;font-weight:600;margin:22px 0 8px}h3{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.head{font-size:17px;font-weight:600;margin:0 0 10px}
.top li{margin:6px 0}.top{padding-left:20px;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;color:var(--ink);text-decoration:none}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.ev{background:var(--bluebg);color:var(--blue);border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.u{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.uh{display:flex;justify-content:space-between;align-items:center;gap:8px}.un{font-weight:600;font-size:15px}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;white-space:nowrap}.ok{background:var(--grnbg);color:var(--grn)}.warn{background:var(--ambbg);color:var(--amb)}.bad{background:var(--redbg);color:var(--red)}
.ut{font-size:13px;color:var(--muted)}.unote{font-size:14px;margin-top:4px}
.t{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.t:last-child{border-bottom:0}
.dot{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.urgent .dot{background:var(--redbg);color:var(--red)}.high .dot{background:var(--ambbg);color:var(--amb)}.normal .dot{background:var(--line);color:var(--muted)}
.tt{flex:1}.tt b{font-weight:600;font-size:15px}.tt div{font-size:13px;color:var(--muted)}
.done{opacity:.4}.done b{text-decoration:line-through}
button.tick{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.watch{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 14px;font-size:14px}.watch div{margin:3px 0}
#gate{max-width:360px;margin:18vh auto 0;padding:0 16px;text-align:center}
#gate input{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:14px 0 8px}
#gate button{width:100%;font-size:16px;padding:12px;border-radius:12px;border:0;background:#1D1D1F;color:#fff;cursor:pointer}
.hidden{display:none}#err{color:var(--red);font-size:14px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--pink)}
</style>
</head>
<body>
<div id="gate">
  <div class="logo" style="text-align:left"><b>SESA<i>.</i></b><small>ESTATES HUB</small></div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">Open hub</button>
  <p id="err" class="hidden">Wrong password, or the data could not be loaded.</p>
</div>
<div id="app" class="wrap hidden"></div>
<script>
let DATA,KEY;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DONE={};try{DONE=JSON.parse(localStorage.getItem('sesaDone')||'{}')}catch(e){}
function saveDone(){try{localStorage.setItem('sesaDone',JSON.stringify(DONE))}catch(e){}}
async function deriveKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function load(pw){const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});const e=await r.json();if(!KEY||pw)KEY=await deriveKey(pw,b64(e.salt),e.iter);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},KEY,b64(e.ct));DATA=JSON.parse(new TextDecoder().decode(p));render()}
async function go(){const pw=document.getElementById('pw').value;document.getElementById('err').classList.add('hidden');
 try{await load(pw);try{sessionStorage.setItem('sesaPw',pw)}catch(e){}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
 catch(e){KEY=null;document.getElementById('err').classList.remove('hidden')}}
function toggle(id){DONE[id]=!DONE[id];if(!DONE[id])delete DONE[id];saveDone();render()}
function ago(t){const m=Math.round((Date.now()-new Date(t))/60000);if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<48)return h+'h ago';return Math.round(h/24)+' days ago'}
function render(){const d=DATA;let h='';
 h+=`<div class="logo"><b>SESA<i>.</i></b><small>ESTATES HUB</small><div class="up">Updated ${esc(ago(d.updated_at))} - ${esc(new Date(d.updated_at).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'}))}</div></div>`;
 h+=`<div class="card"><p class="head">${esc(d.headline)}</p><ol class="top">${(d.top3||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
 h+=`<div class="chips">${d.properties.map(p=>{const open=p.tasks.filter(t=>!DONE[t.id]).length;return `<a class="chip" href="#${esc(p.id)}">${esc(p.name)} <b>${open}</b></a>`}).join('')}</div>`;
 if((d.watch||[]).length)h+=`<h3>Watch out</h3><div class="watch">${d.watch.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`;
 for(const p of d.properties){const tot=p.tasks.length,dn=p.tasks.filter(t=>DONE[t.id]).length;
  h+=`<h2 id="${esc(p.id)}">${esc(p.name)}</h2><div class="sub">${esc(p.area)} - ${esc(p.status)}</div>`;
  if(p.event)h+=`<div class="ev">${esc(p.event)}</div>`;
  h+=`<div class="grid">${p.units.map(u=>`<div class="u"><div class="uh"><span class="un">${esc(u.name)}</span><span class="tag ${esc(u.tag)}">${esc(u.label)}</span></div><div class="ut">${esc(u.tenant)}</div><div class="unote">${esc(u.note)}</div></div>`).join('')}</div>`;
  h+=`<h3>Tasks - ${dn} of ${tot} done</h3><div class="card" style="padding-top:4px;padding-bottom:4px"><div class="prog"><i style="width:${tot?Math.round(dn/tot*100):0}%"></i></div>`;
  p.tasks.forEach((t,i)=>{h+=`<div class="t ${esc(t.level)} ${DONE[t.id]?'done':''}"><div class="dot">${i+1}</div><div class="tt"><b>${esc(t.title)}</b><div>${esc(t.detail)}</div></div><button class="tick" onclick="toggle('${esc(t.id)}')">${DONE[t.id]?'Undo':'Done'}</button></div>`});
  h+=`</div>`}
 document.getElementById('app').innerHTML=h}
(async()=>{let pw;try{pw=sessionStorage.getItem('sesaPw')}catch(e){}if(pw){document.getElementById('pw').value=pw;go()}})();
</script>
</body>
</html>
