<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D1D1F">
<title>Sesa Estates Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ed;--card:#fff;--ink:#1d1d1f;--muted:#6f6d68;--line:#e7e3dc;--soft:#f7f5f1;--pink:#F07C8C;--pinkbg:#fde8eb;--dark:#1D1D1F;
--red:#c2412d;--redbg:#fbe6e1;--amb:#9a5f00;--ambbg:#fdf0d6;--grn:#1f7a45;--grnbg:#e0f3e7;--blue:#2a63b0;--bluebg:#e4eefb;--violet:#6a4bc4;--violetbg:#ece6fb;
--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--ink:#f3f2ef;--muted:#a19f99;--line:#2c2b29;--soft:#242426;--pinkbg:#3a1e23;
--redbg:#3a1c17;--red:#f29a87;--ambbg:#382a10;--amb:#f3c46a;--grnbg:#143022;--grn:#86d6a0;--bluebg:#16263c;--blue:#8fb9f0;--violetbg:#241c3d;--violet:#b8a4f2;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
/* hero */
.hero{background:var(--dark);color:#fff;border-radius:0 0 28px 28px;padding:20px 18px 18px;margin:0 -16px 16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,124,140,.45),transparent 70%)}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand b{font-size:22px;letter-spacing:5px;font-weight:700}.brand b i{color:var(--pink);font-style:normal}
.brand small{display:block;letter-spacing:5px;font-size:12px;color:#9d9d9d}
.upd{font-size:12px;color:#bdbdbd;background:#2b2b2e;border-radius:20px;padding:6px 11px;display:flex;align-items:center;gap:6px}
.upd i{width:7px;height:7px;border-radius:50%;background:#5bd68b;display:block}
.hrow{display:flex;align-items:center;gap:16px;margin-top:16px;position:relative;z-index:1}
.hi{font-size:21px;font-weight:700;line-height:1.25}.hisub{font-size:13px;color:#c9c9c9;margin-top:3px}
.bigring{flex:0 0 auto;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.stat{border-radius:16px;padding:11px 11px 10px;color:#1d1d1f}
.stat .v{font-size:19px;font-weight:700;line-height:1.2}.stat .l{font-size:12px;opacity:.75;font-weight:500}
.s1{background:#c9f0d6}.s2{background:#ffd3da}.s3{background:#d6e4fb}
/* sections */
.sec{animation:rise .3s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:17px;font-weight:700;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2 .cnt{font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.story{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--pink);border-radius:22px;padding:16px 18px;box-shadow:0 6px 18px rgba(29,29,31,.06)}
.story small{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--pink)}
.story p{margin:4px 0 0;font-size:17px;font-weight:600;line-height:1.4}
/* D 21 Nov 15:47: Today's story became a tap-through Stories reel (headline, each property, money) */
.sty{position:relative;display:grid;border-radius:24px;min-height:206px;overflow:hidden;color:#fff;box-shadow:0 10px 26px rgba(29,29,31,.18);user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:pointer;outline-offset:3px}
.sty .sbars{position:absolute;top:10px;left:14px;right:14px;display:flex;gap:5px;z-index:3}
.sty .sbars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.32);overflow:hidden}
.sty .sbars b{display:block;height:100%;width:0;background:#fff;border-radius:4px}
.sty .sbars i.dn b{width:100%}.sty .sbars i.on b{animation:sfill 6s linear forwards}
.sty.paused .sbars i.on b{animation-play-state:paused}
@keyframes sfill{from{width:0}to{width:100%}}
.sty .sl{grid-area:1/1;position:relative;min-width:0;padding:28px 18px 16px;display:flex;flex-direction:column;opacity:0;transform:translateX(18px) scale(.98);transition:opacity .35s,transform .35s;pointer-events:none}
.sty .sl.on{opacity:1;transform:none;pointer-events:auto}.sty .sl.was{transform:translateX(-18px) scale(.98)}
.sty .sk{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.sty .sk .bub{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;border:2px solid rgba(255,255,255,.55)}
.sty .sk .ct{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.8}
.sty .sx{margin:12px 0 0;font-size:19px;font-weight:700;line-height:1.32;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;position:relative;z-index:1;max-width:92%}
.sty .sx em{font-style:normal;background:rgba(255,255,255,.24);border-radius:8px;padding:0 5px}
.sty .sf{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.sty .sgo{min-height:44px;border:0;border-radius:22px;background:#fff;color:#1d1d1f;font:600 14px Poppins,system-ui,sans-serif;padding:0 14px 0 16px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.sty .shint{font-size:12px;opacity:.75;margin-left:auto}
.sty .bigi{position:absolute;right:-18px;bottom:-22px;opacity:.14;transform:rotate(-12deg);pointer-events:none}
.sty .sdk{background:linear-gradient(135deg,#1D1D1F 0%,#3b2530 60%,#F07C8C 160%)}
/* O 21 Nov 17:13: soft scrim + shadow so white text reads on the light pink and amber slides */
.sty .sl:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.22));pointer-events:none}
.sty .sx,.sty .sk{text-shadow:0 1px 3px rgba(0,0,0,.22)}.sty .sk{position:relative;z-index:1}
.sty.off .sbars i.on b{animation-play-state:paused}
.sty .sdk .bub{background:#F07C8C;border-color:#fff}
@media (min-width:900px){.sty{min-height:180px}.sty .sx{font-size:21px;max-width:80%}}
@media (prefers-reduced-motion:reduce){.sty .sbars i.on b{animation:none;width:100%}.sty .sl{transition:none}}
/* top 3 */
.moves{display:grid;gap:10px}
.move{border-radius:20px;padding:14px 12px 14px 16px;display:flex;align-items:center;gap:14px;position:relative;transition:transform .15s,opacity .3s}
.move .num{width:40px;height:40px;border-radius:14px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
.move p{margin:0;font-size:15px;font-weight:600;line-height:1.4;flex:1}
.m1{background:var(--pinkbg)}.m1 .num{background:var(--pink)}.m2{background:var(--bluebg)}.m2 .num{background:var(--blue)}.m3{background:var(--violetbg)}.m3 .num{background:var(--violet)}
.move.done{opacity:.5}.move.done p{text-decoration:line-through}
/* check button */
.chk{width:44px;height:44px;border-radius:50%;border:2px solid rgba(0,0,0,.15);background:var(--card);cursor:pointer;flex:0 0 44px;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0}
.chk svg{opacity:0;transition:opacity .2s}
.done .chk{background:var(--grn);border-color:var(--grn)}.done .chk svg{opacity:1}
.chk:active{transform:scale(.88)}
@media (prefers-color-scheme:dark){.chk{border-color:rgba(255,255,255,.28)}}
.task .chk{align-self:flex-start}
/* watch */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px;line-height:1.45}
.alert .ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--ambbg);color:var(--amb)}
.alert.r .ic{background:var(--redbg);color:var(--red)}
.more{width:100%;margin-top:8px;min-height:44px;border:1px dashed var(--line);background:none;border-radius:16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
/* property cards */
.props{display:grid;gap:12px}
.pc{border-radius:24px;padding:18px;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;border:0;text-align:left;width:100%;display:block}
.pc:active,.move:active{transform:scale(.98)}
.pc:after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.pc .row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.pc .pn{font-size:18px;font-weight:700;line-height:1.25}.pc .pa{font-size:13px;opacity:.88}
.pc .go{margin-left:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.pbar{height:10px;border-radius:8px;background:rgba(255,255,255,.28);margin:14px 0 8px;overflow:hidden;position:relative;z-index:1}.pbar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600;position:relative;z-index:1;align-items:center}
.chip{background:rgba(255,255,255,.22);border-radius:20px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.faces{display:flex;gap:4px;margin-left:auto}
.g0{background:linear-gradient(135deg,#F07C8C,#f5a07c)}.g1{background:linear-gradient(135deg,#4c7de0,#6a4bc4)}.g2{background:linear-gradient(135deg,#2f9a63,#1f7a45)}.g3{background:linear-gradient(135deg,#d48a1c,#b8641a)}
.mt{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);width:100%;text-align:left}
.mt .ic{width:46px;height:46px;border-radius:15px;background:var(--grnbg);color:var(--grn);display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.mt .v{font-size:22px;font-weight:700;color:var(--grn);line-height:1.1}.mt .l{font-size:13px;color:var(--muted)}
.spark{margin-left:auto;display:flex;gap:7px;align-items:flex-end;height:52px}.spark span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:12px;font-weight:600;color:var(--muted)}.spark i{width:16px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#5bd68b,var(--grn));display:block;min-height:4px;max-height:34px}.spark .pt i{opacity:.55}
/* money */
.bar em.net{font-style:normal;font-size:12px;font-weight:800;border-radius:10px;padding:2px 7px;margin-top:4px;background:#fff;white-space:nowrap;animation:netpop .5s cubic-bezier(.2,.9,.3,1.4) both}
.bar em.net.neg{color:#c2334a}.bar em.net.pos{color:#1f7a45}
.bar:nth-child(2) em.net{animation-delay:.12s}.bar:nth-child(3) em.net{animation-delay:.24s}.bar:nth-child(4) em.net{animation-delay:.36s}
.mhero .bars{height:156px}
.netkey{font-size:12px;opacity:.85;margin:10px 0 2px}
@keyframes netpop{from{opacity:0;transform:translateY(6px) scale(.8)}to{opacity:1;transform:none}}
.cover{margin:12px 0 4px;background:rgba(0,0,0,.16);border-radius:16px;padding:10px 12px 8px}
.cover .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:500}.cover .ct b{font-size:18px;font-weight:800}.cover .ct em{font-style:normal;font-weight:700;font-size:13px;background:#fff;color:#1f7a45;border-radius:999px;padding:2px 9px;white-space:nowrap}
.cover .cb{position:relative;height:16px;border-radius:999px;background:rgba(255,255,255,.22);margin:8px 0 6px;overflow:visible}
.cover .cb i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#fff,#F07C8C);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.cover .cb s{position:absolute;top:3px;bottom:3px;width:2px;background:rgba(255,255,255,.35);text-decoration:none}
.cover .cf{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:12px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.cover .cl2{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
@media (prefers-reduced-motion:reduce){.cover .cb i{transition:none}}
.owed{background:var(--card);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow);border-left:6px solid var(--pink)}
.owh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.owi{width:44px;height:44px;border-radius:14px;background:var(--dark);display:grid;place-items:center;flex:none;position:relative}.owi::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--card)}
.owl{font-size:13px;color:var(--muted);font-weight:600}.owt{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.05}.own2{margin-left:auto;background:var(--pinkbg);color:var(--ink);font-weight:700;font-size:12px;border-radius:99px;padding:5px 10px;white-space:nowrap}
.owr{display:grid;gap:10px}.owb{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px}.owk{font-weight:700;font-size:14px}.owb b{font-size:16px;font-weight:800;min-width:64px;text-align:right}
.owt2{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}.owt2 i{display:block;height:100%;width:var(--w);border-radius:99px;animation:owg .8s cubic-bezier(.2,.8,.2,1) var(--d) both}.owt2 i.hi{background:linear-gradient(90deg,#e4576b,#c2412d)}.owt2 i.mid{background:linear-gradient(90deg,#F07C8C,#e4576b)}.owt2 i.lo{background:#f5b3bd}
.owt2 i{min-width:6px}@media (prefers-color-scheme:dark){.owi{background:var(--pink)}.owi::after{background:#fff}}
.ows{margin-top:12px;font-size:12px;color:var(--muted)}@keyframes owg{from{width:0}}@media(prefers-reduced-motion:reduce){.owt2 i{animation:none}}
.mhero .pendn{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 10px}
.mhero{background:linear-gradient(135deg,#1f7a45,#2fa463);color:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 24px rgba(31,122,69,.25)}
.mhero .l{font-size:13px;opacity:.9;font-weight:500}.mhero .big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.bars{display:flex;gap:12px;align-items:flex-end;height:130px;margin:16px 2px 4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bpair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bpair i{display:block;width:40%;max-width:30px;border-radius:8px 8px 3px 3px;transition:height .8s cubic-bezier(.2,.8,.2,1);height:0}
.bpair i.r{background:#fff}.bpair i.c{background:rgba(255,255,255,.3)}
.bar span{font-size:12px;opacity:.9}.bar b{font-size:12px;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;opacity:.9}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;background:rgba(255,255,255,.55)}
.tile b{font-size:20px;font-weight:700;line-height:1.2}.tile span{font-size:12px;font-weight:500;opacity:.8}
.tb{background:var(--bluebg);color:var(--blue)}.tp{background:var(--pinkbg);color:#b34657}
@media (prefers-color-scheme:dark){.tp{color:var(--pink)}.tile .ic{background:rgba(255,255,255,.08)}}
.wait{display:grid;gap:10px}
.rch{cursor:pointer}.rc{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.rc:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grn)}.rc.k-warn:before{background:var(--amb)}.rc.k-bad:before{background:var(--red)}
.rch{display:flex;gap:14px;align-items:center}.rcd{flex:0 0 92px}.rca{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.rci{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}.rcn{font-weight:700;font-size:16px}
.rcs{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--grnbg);color:var(--grn)}.rcs.warn{background:var(--ambbg);color:var(--amb)}.rcs.bad{background:var(--redbg);color:var(--red)}
.rci .nx{white-space:nowrap;margin:2px 0 0}.rcsub{font-size:13px;color:var(--muted);line-height:1.35}
.rtr{display:grid;grid-template-columns:1fr 1fr;margin:14px 2px 4px;position:relative}.rtr.three{grid-template-columns:1fr 1fr 1fr}
.rtr:before{content:"";position:absolute;left:8px;right:8px;top:6px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--line),var(--pink))}
.rp1{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;font-size:12px;color:var(--muted)}.rp1:first-child{align-items:flex-start;text-align:left}.rp1:last-child{align-items:flex-end;text-align:right}
.rp1 i{width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--muted);margin-bottom:5px}.rp1 b{color:var(--ink);font-weight:600}
.rp1.pa i{background:var(--grn);border-color:var(--grn)}.rp1.no i{border-color:var(--red);border-style:dashed}.rp1.td i{background:var(--pink);border-color:var(--pink);animation:tdp 1.8s infinite}.rp1.fu i{border-color:var(--pink)}
.rcd2{margin-top:10px;background:var(--soft);border-radius:14px;font-size:13px;line-height:1.45}.rcd2 summary{list-style:none;cursor:pointer;padding:10px 12px;min-height:44px;box-sizing:border-box}.rcd2 summary::-webkit-details-marker{display:none}
.rcd2 .cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rcd2[open] .cl{-webkit-line-clamp:unset;display:block}
.wc{display:flex;gap:12px;background:var(--ambbg);color:var(--ink);border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.45}
.wc .ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:rgba(255,255,255,.6);color:var(--amb);display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){.wc .ic{background:rgba(255,255,255,.08)}}
.wc b{display:block;color:var(--amb);font-weight:700}
.pays{display:grid;gap:8px}
.pay{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.pay .ic{width:40px;height:40px;border-radius:13px;background:var(--grnbg);color:var(--grn);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.pay .amt{margin-left:auto;font-weight:700;color:var(--grn);font-size:16px;white-space:nowrap}.pay .w{font-size:14px;font-weight:600}.pay .d{font-size:12px;color:var(--muted)}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{flex:0 0 132px}
.dl{flex:1;display:grid;gap:7px;font-size:13px;min-width:0}.dl div{display:flex;align-items:center;gap:8px}.dl i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}.dl b{margin-left:auto;font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
/* property page */
.pban{border-radius:26px;padding:18px;color:#fff;position:relative;overflow:hidden}

.tg{background:var(--grnbg);color:var(--grn)}.ta{background:var(--ambbg);color:var(--amb)}.tv{background:var(--violetbg);color:var(--violet)}.tk{background:#e0f4f4;color:#16797a}.ts{background:var(--soft);color:var(--muted)}

.tchip{border:0;font-family:inherit;cursor:pointer;min-height:44px;transition:transform .15s}.tchip:active{transform:scale(.94)}.tchip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;border-radius:999px;padding:7px 12px 7px 9px;font-size:13px;font-weight:600}.tchip b{font-weight:800}
.alert .ic.tico{width:38px;height:38px;flex:0 0 38px;border-radius:12px}
.hot{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.alert .ic.tg,.alert.r .ic.tg{background:var(--grnbg);color:var(--grn)}.alert .ic.ta,.alert.r .ic.ta{background:var(--ambbg);color:var(--amb)}.alert .ic.tv,.alert.r .ic.tv{background:var(--violetbg);color:var(--violet)}.alert .ic.tk,.alert.r .ic.tk{background:#e0f4f4;color:#16797a}.alert .ic.ts,.alert.r .ic.ts{background:var(--soft);color:var(--muted)}.alert .ic.tb,.alert.r .ic.tb{background:var(--bluebg);color:var(--blue)}.alert .ic.tp,.alert.r .ic.tp{background:var(--pinkbg);color:#b34657}

/* D 21 Nov: Heads up radar */
.hu{background:var(--dark);color:#fff;border-radius:24px;padding:16px 16px 14px;position:relative;overflow:hidden;margin-bottom:10px}
.hu:after{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(240,124,140,.35),transparent 70%)}

@keyframes hublink{50%{opacity:.25}}

/* nav */

.nb{flex:1;min-height:54px;border:0;background:none;color:#a9a9ad;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;cursor:pointer;position:relative;padding:4px 2px;min-width:0}
.nb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb.on{background:#fff;color:#1d1d1f}
.nb .n{position:absolute;top:4px;right:calc(50% - 22px);background:var(--pink);color:#fff;border-radius:10px;font-size:12px;line-height:17px;padding:0 5px;min-width:17px;font-weight:700}
/* toast, confetti */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#fff;color:#1d1d1f;border-radius:24px;padding:11px 18px;font:600 14px Poppins,sans-serif;opacity:0;transition:all .25s ease;pointer-events:none;z-index:20;white-space:normal;max-width:calc(100vw - 32px);width:max-content;text-align:center;line-height:1.35;box-sizing:border-box;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:fall 1.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
/* gate */
#gate .plink{text-align:center;margin:14px 0 6px;font-size:14px}#gate .plink a{color:var(--ink);opacity:.7}#gate #perr{color:#d33}
.hout{font:600 12px Poppins,sans-serif;margin-left:8px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;cursor:pointer;vertical-align:middle}
#gate{max-width:380px;margin:14vh auto 0;padding:0 18px}
#gate .hero{border-radius:24px;margin:0 0 16px;padding:24px 20px}
#gate .hi{margin-top:18px;position:relative;z-index:1}
#gate input{width:100%;font:16px Poppins,sans-serif;padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:0 0 10px}
#gate button{width:100%;font:600 16px Poppins,sans-serif;padding:15px;border-radius:16px;border:0;background:var(--pink);color:#fff;cursor:pointer;min-height:52px}
#err{color:var(--red);font-size:14px;text-align:center}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hidden{display:none!important}
@media (min-width:760px){.props{grid-template-columns:1fr 1fr}.moves{grid-template-columns:repeat(3,1fr)}.move{flex-direction:column;align-items:flex-start}.move .chk{align-self:flex-end}.alerts{grid-template-columns:1fr 1fr}.pays,.wait{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* A2 18 Nov: rent by property + in vs out */
.io{margin-top:10px}.io .ttl{font-size:15px;font-weight:700;margin-bottom:10px}
.io .sbar{display:flex;height:22px;border-radius:12px;overflow:hidden;background:var(--line)}
.io .sbar i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.io .sbar .r{background:var(--grn)}.io .sbar .c{background:var(--pink)}
.io .lg{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--muted)}.io .lg b{color:var(--ink);font-size:16px}
.io .say{margin-top:10px;font-size:15px;line-height:1.4}
.rp{display:grid;gap:10px}
.rpc{border-radius:20px;padding:14px 16px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:0;text-align:left;font:inherit;cursor:pointer;width:100%}
.rpc .n{font-weight:700;font-size:16px}.rpc .v{font-size:24px;font-weight:800;text-align:right}
.rpc .m{font-size:13px;opacity:.92;grid-column:1/-1}
.rpc .tr{grid-column:1/-1;height:8px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}.rpc .tr i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rpc.zero{background:var(--card)!important;color:var(--ink);border:2px dashed var(--red)}.rpc.zero .v{color:var(--red)}.rpc.zero .tr{background:var(--redbg)}
.rstrip{background:rgba(255,255,255,.16);border-radius:14px;padding:9px 12px 8px;margin-top:10px;max-width:440px}.rsh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex-wrap:wrap}.rsh b{font-size:15px}.rsh span{opacity:.85;font-weight:500}
.rsb{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:6px}.rsc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.rsc i{display:block;width:100%;max-width:46px;height:var(--h);background:#fff;border-radius:7px 7px 3px 3px;transform-origin:bottom;animation:rsg .6s cubic-bezier(.2,.8,.3,1.25) both}.rsc.zero i{background:rgba(255,255,255,.35)}.rsc.now i{background:repeating-linear-gradient(135deg,#fff 0 5px,rgba(255,255,255,.6) 5px 10px)}
.rsc em{font-style:normal;font-size:11px;font-weight:700;margin-bottom:3px;white-space:nowrap}.rsc span{font-size:11px;font-weight:600;opacity:.9;margin-top:3px}@keyframes rsg{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.rsc i{animation:none}}
.rentchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:12px;padding:5px 10px;font-size:13px;font-weight:600;margin-top:8px}

/* D 18 Nov: weekly streak + points */
.streak{border-radius:24px;padding:16px;background:linear-gradient(135deg,#fff3d6,#ffe1c2);color:#1d1d1f;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(227,163,46,.18)}
.streak:after{content:"";position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.45)}
.sk-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.flame{width:52px;height:52px;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 52px;box-shadow:0 4px 12px rgba(227,100,46,.18)}
.flame.off{filter:grayscale(1);opacity:.55}
.flame.lit svg{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}@keyframes flick{50%{transform:scale(1.08) rotate(-3deg)}}
.sk-n{font-size:22px;font-weight:800;line-height:1.1}.sk-l{font-size:13px;font-weight:500;color:#6b5320}
.pts{margin-left:auto;background:#1d1d1f;color:#fff;border-radius:16px;padding:7px 12px;text-align:center;line-height:1.1}
.pts b{display:block;font-size:18px;font-weight:800;color:#ffcf5c}.pts span{font-size:12px;font-weight:600;opacity:.8}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;position:relative;z-index:1;max-width:440px}
.dy{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#7a6638}
.dy i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:#b07a10;border:2px solid transparent}
.dy.on i{background:linear-gradient(135deg,#ff9a3c,#F07C8C);color:#fff}
.dy.today i{border-color:#1d1d1f}.dy.today:not(.on) i{animation:nudgeDot 2s ease-in-out infinite}@keyframes nudgeDot{50%{box-shadow:0 0 0 5px rgba(240,124,140,.35)}}.dy.fut i{opacity:.45}
.goal{margin-top:14px;position:relative;z-index:1}
.goal .gt{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.goal .gb{height:14px;border-radius:10px;background:rgba(255,255,255,.75);overflow:hidden}
.goal .gb i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#ff9a3c,#F07C8C);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.goal.won .gb i{background:linear-gradient(90deg,#2f9a63,#5bd68b)}
@media (prefers-color-scheme:dark){.streak{background:linear-gradient(135deg,#3a2a10,#3a1f1c);color:#f3f2ef;box-shadow:none}.streak:after{background:rgba(255,255,255,.05)}
.flame{background:#2a2a2c}.sk-l,.dy{color:#e3c78a}.dy i{background:rgba(255,255,255,.1);color:#f3c46a}.dy.today i{border-color:#fff}.goal .gb{background:rgba(255,255,255,.12)}.pts{background:#fff;color:#1d1d1f}.pts b{color:#d4800c}}

/* D 21 Nov 12:47: badge shelf in Your week */
.bdg{margin-top:16px;position:relative;z-index:1}
.bdg .bt{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:8px}
.bdg .bt em{font-style:normal;background:#1d1d1f;color:#ffcf5c;border-radius:10px;padding:2px 9px;font-size:12px}
.brow{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.brow::-webkit-scrollbar{display:none}
.bd{flex:0 0 66px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.bd .bc{width:56px;height:56px;border-radius:50%;padding:4px;background:conic-gradient(#F07C8C calc(var(--p)*1%),rgba(255,255,255,.7) 0);position:relative}
.bd .bc i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:#fff;color:#c9b48a}
.bd.got .bc{background:var(--g);box-shadow:0 6px 14px rgba(0,0,0,.16)}
.bd.got .bc i{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55)}
.bd.got .bc:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{background-position:150% 0}100%{background-position:-100% 0}}
.bd span{font-size:12px;font-weight:700;line-height:1.15;text-align:center;color:#6b5320;max-width:66px}
.bd:not(.got) span{opacity:.75}.bd b{font-size:12px;font-weight:700;color:#b07a10;line-height:1}
/* O 21 Nov 14:13: locked badges tinted in their own colour, next badge glows */
.bdg .bt small{flex:1;min-width:0;margin:0 8px;font-size:12px;font-weight:600;color:#8a5a00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd:not(.got) .bc i{background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c)}.bd:not(.got) .bc i svg{opacity:.85}.brow{align-items:flex-start}
.bd.bnext .bc{animation:bnx 2.2s ease-in-out infinite}.bd.bnext .bc i svg{opacity:1}.bd.bnext span{opacity:1}
.bd.bnext b{background:#F07C8C;color:#fff;border-radius:8px;padding:0 6px;line-height:14px}
@keyframes bnx{0%,100%{box-shadow:0 0 0 0 rgba(240,124,140,.55)}50%{box-shadow:0 0 0 7px rgba(240,124,140,0)}}
@media (prefers-reduced-motion:reduce){.bd.bnext .bc{animation:none}}
.bd.new .bc{animation:bpop .9s cubic-bezier(.2,1.6,.4,1)}@keyframes bpop{0%{transform:scale(.3) rotate(-30deg)}100%{transform:none}}
@media (prefers-color-scheme:dark){.bdg .bt small{color:#f3c46a}.bd:not(.got) .bc i{background:color-mix(in srgb,var(--c) 22%,#2a2a2c)}.bdg .bt em{background:#fff;color:#1d1d1f}.bd .bc{background:conic-gradient(#F07C8C calc(var(--p)*1%),rgba(255,255,255,.12) 0)}.bd .bc i{background:#2a2a2c;color:#8a7a5a}.bd span{color:#e3c78a}.bd b{color:#f3c46a}}

/* D 18 Nov 15:47: Coming up - calendar strip of dated items */
.cal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.cal::-webkit-scrollbar{display:none}
.dt{flex:0 0 172px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.dt .dh{padding:12px 14px 10px;color:#fff;display:flex;align-items:flex-end;gap:10px;position:relative;overflow:hidden}
.dt .dh:after{content:"";position:absolute;right:-30px;top:-34px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14)}
.dt .dn{font-size:34px;font-weight:800;line-height:.95;letter-spacing:-1px}
.dt .dn small{font-size:14px;font-weight:700;letter-spacing:.5px;margin-left:5px;text-transform:uppercase;opacity:.9}
.dt .dw{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.92;line-height:1.3}
.dt .cd{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.25);border-radius:20px;padding:3px 9px;white-space:nowrap;position:relative;z-index:1}
.dt.now .dh{background:#1D1D1F}.dt.now .cd{background:var(--pink)}
.dt.now{border-color:var(--pink);box-shadow:0 8px 22px rgba(240,124,140,.25)}
.dt .its{display:grid;gap:4px;padding:8px}
.ev2{display:flex;gap:8px;align-items:flex-start;border:0;background:var(--soft);border-radius:14px;padding:8px 9px;text-align:left;font:inherit;font-size:13px;font-weight:600;line-height:1.35;cursor:pointer;min-height:44px;width:100%;color:var(--ink)}
.ev2 i{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:5px}
.ev2 span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev2.urg{background:var(--redbg)}
.calgap{flex:0 0 auto;align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;width:34px}
.calgap b{width:4px;height:4px;border-radius:50%;background:var(--line);display:block}
.calempty{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--grnbg);color:var(--grn);font-weight:700;font-size:14px}
@media (min-width:760px){.dt{flex-basis:200px}}

/* D 18 Nov 18:47: What's new since your last visit */
.news{border-radius:24px;padding:16px;background:linear-gradient(135deg,#6a4bc4,#4c7de0);color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(76,125,224,.28);transition:opacity .3s,transform .3s}
.news:before{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.news:after{content:"";position:absolute;left:-30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(240,124,140,.35)}
.news.bye{opacity:0;transform:scale(.96)}
.nwtop{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.nwic{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:0 0 48px}
.nwic svg{animation:twk 2.4s ease-in-out infinite}@keyframes twk{50%{transform:rotate(18deg) scale(1.12)}}
.nwn{font-size:20px;font-weight:800;line-height:1.1}.nwl{font-size:13px;opacity:.88}
.gotit{margin-left:auto;min-height:44px;border:0;border-radius:22px;background:#fff;color:#1d1d1f;font:700 13px Poppins,sans-serif;padding:0 16px;cursor:pointer;white-space:nowrap}
.nwch{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative;z-index:1}
.nwch span{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700;color:#1d1d1f}
.nwls{display:grid;gap:6px;margin-top:12px;position:relative;z-index:1}
.nwr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:0;border-radius:14px;padding:8px 10px;color:#fff;font:600 13px/1.35 Poppins,sans-serif;text-align:left;width:100%;min-height:44px;cursor:pointer}
.nwr .d{width:28px;height:28px;border-radius:10px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:#1d1d1f}
.nwr .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nwr small{display:block;font-size:12px;font-weight:500;opacity:.8}
.nwr .ar{opacity:.7;flex:0 0 auto}
@media (min-width:760px){.nwls{grid-template-columns:1fr 1fr}.nwls>.nwl{grid-column:1/-1}}
.newb{display:inline-block;font-style:normal;font-size:12px;font-weight:800;letter-spacing:.5px;border-radius:8px;padding:1px 7px;margin-right:6px;vertical-align:1px;background:var(--pink);color:#fff;animation:pop .5s ease 2}
.newb.up{background:var(--blue)}
@media (prefers-color-scheme:dark){.newb.up{background:#4c7de0}}
.nb .nd{position:absolute;top:6px;left:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:#ffcf5c;box-shadow:0 0 0 2px #1d1d1f}
.nb.on .nd{box-shadow:0 0 0 2px #fff}
.chip.nwc{background:#fff;color:#4c3aa0}
/* O 18 Nov 20:13: What's new shows 3 rows, rest behind a toggle */
.nwmore{display:contents}.nwmore[hidden]{display:none}
.nwtog{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px dashed rgba(255,255,255,.45);border-radius:14px;background:none;color:#fff;font:700 13px Poppins,sans-serif;cursor:pointer}
.nwtog[aria-expanded=true] svg{transform:rotate(-90deg)}.nwtog svg{transform:rotate(90deg);transition:transform .2s}
@media (min-width:760px){.nwtog{grid-column:1/-1}}
/* D 19 Nov: swipe stack for Your 3 things */
.stkw{display:grid;gap:12px}
.stk{display:grid;padding-bottom:30px;position:relative}
.sc{grid-area:1/1;position:relative;align-items:stretch;border-radius:26px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;min-height:178px;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;will-change:transform;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sc.p0{z-index:3;color:#fff;box-shadow:0 14px 30px rgba(29,29,31,.18);cursor:grab}
.sc.m1{background:linear-gradient(135deg,#e2586f,#ee8160)}.sc.m2{background:linear-gradient(135deg,#4c7de0,#46b3d6)}.sc.m3{background:linear-gradient(135deg,#6a4bc4,#b067d6)}
.sc.p1{z-index:2;transform:translateY(13px) scale(.94);opacity:.55}.sc.p2{z-index:1;transform:translateY(26px) scale(.88);opacity:.3}
.sc.p1>*,.sc.p2>*{visibility:hidden}
.sc .top{display:flex;align-items:center;gap:10px}
.sc .num{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:rgba(255,255,255,.25);color:#fff}
.sc .of{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.9}
.sc .sw{margin-left:auto;font-size:12px;opacity:.85;display:flex;align-items:center;gap:4px}
.sc p{margin:0;font-size:18px;font-weight:700;line-height:1.35;flex:1}
.sc .bt{display:flex;gap:10px}
.sc .bt button{flex:1;min-height:48px;border-radius:16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;border:0}
.sc .lat{background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.45)!important}
.sc .dn{background:#fff;color:#1d1d1f}
.sc .dn svg{stroke:#1f7a45}
.sc .tag{position:absolute;top:18px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:14px;letter-spacing:1px;opacity:0;transition:opacity .1s;border:3px solid #fff;color:#fff}
.sc .tag.l{left:18px;transform:rotate(-10deg);background:rgba(29,29,31,.35)}.sc .tag.r{right:18px;transform:rotate(10deg);background:#2f9a63}
.sc.fly-r{transform:translateX(130%) rotate(18deg)!important;opacity:0}.sc.fly-l{transform:translateX(-130%) rotate(-18deg)!important;opacity:0}
.sc.drag{transition:none;cursor:grabbing}
.sc.wig{animation:wig .4s}@keyframes wig{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sc.win{background:linear-gradient(135deg,#2f9a63,#7cc98f);color:#fff;align-items:center;justify-content:center;text-align:center;z-index:3;box-shadow:0 14px 30px rgba(47,154,99,.28)}
.sc.win .big{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.3)}to{transform:scale(1)}}
.sc.win p{flex:0;font-size:20px}.sc.win small{opacity:.9;font-size:14px}
.pips{display:flex;gap:6px;justify-content:center;margin-top:-8px}
