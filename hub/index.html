<script>try{const t=localStorage.getItem("hubTheme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eaeded;--card:#fff;--ink:#0f1111;--muted:#565959;--line:#d5d9d9;--soft:#f0f2f2;--acc:#ff9900;--acc2:#ec7211;--accink:#0f1111;--teal:#007185;--navy:#232f3e;--navy2:#131921;
--red:#cc0c39;--redbg:#fde8ec;--amb:#c45500;--ambbg:#fff4e5;--grn:#067d62;--grnbg:#e6f4f1;--blue:#146eb4;--bluebg:#e7f1fa;--shadow:0 1px 2px rgba(15,17,17,.12),0 4px 12px rgba(15,17,17,.06);--heroink:#fff;--herosub:#c9cccc;color-scheme:light}
:root[data-theme="dark"]{--bg:#0f1418;--card:#1b232c;--ink:#e9eded;--muted:#a3aaaa;--line:#2c3742;--soft:#232d38;--teal:#4fb8c9;--red:#ff6b81;--redbg:#3a1820;--amb:#ffb35c;--ambbg:#3a2a12;--grn:#4cc9a6;--grnbg:#13312a;--blue:#6fb2ff;--bluebg:#172a40;--shadow:none;--navy:#1b232c;--navy2:#0b1015;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--card:#1b232c;--ink:#e9eded;--muted:#a3aaaa;--line:#2c3742;--soft:#232d38;--teal:#4fb8c9;--red:#ff6b81;--redbg:#3a1820;--amb:#ffb35c;--ambbg:#3a2a12;--grn:#4cc9a6;--grnbg:#13312a;--blue:#6fb2ff;--bluebg:#172a40;--shadow:none;--navy:#1b232c;--navy2:#0b1015;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Amazon Ember",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(180deg,var(--navy2),var(--navy));color:var(--heroink);padding:calc(16px + env(safe-area-inset-top)) 0 20px;position:relative;border-bottom:3px solid var(--acc)}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em;display:inline-block;padding-bottom:3px;border-bottom:3px solid var(--acc);border-radius:0 0 40% 40%/0 0 6px 6px}.logo i{color:var(--acc);font-style:normal}
.sub{color:var(--herosub);font-size:13px;margin-top:4px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tr{display:flex;gap:8px}
.me,.thm{display:flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:40px}
.thm{width:40px;justify-content:center;padding:0}
.hi{font-size:24px;font-weight:700;margin:16px 0 2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:8px 15px;background:rgba(255,255,255,.06);color:#e3e6e6;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0f1111}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{border-radius:10px;padding:11px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff}.stat b{display:block;font-size:21px;font-weight:800;line-height:1.2}.stat span{font-size:12px;color:var(--herosub);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.s1 b{color:#7ee2c4}.s2 b{color:var(--acc)}.s3 b{color:#9fd0ff}
h2{font-size:19px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:2px 9px;color:var(--muted)}
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.story{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:16px 16px 18px;margin-top:18px;box-shadow:var(--shadow)}
.story small{letter-spacing:.1em;font-weight:800;font-size:12px;color:var(--acc2)}.story p{font-size:19px;font-weight:700;margin:6px 0 0;line-height:1.3}
.t3{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.t3:first-child{border-top:0;padding-top:0}
.num{flex:0 0 30px;height:30px;border-radius:8px;background:var(--acc);color:#0f1111;font-weight:800;display:flex;align-items:center;justify-content:center}
.watch li{margin:0 0 8px}.watch{padding-left:18px;margin:0}.watch li::marker{color:var(--acc2)}
.pgrid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:620px){.pgrid{grid-template-columns:1fr 1fr}}
.pc{text-align:left;width:100%;cursor:pointer;border-radius:10px;padding:14px 14px 14px 18px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:120px}
.pc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
.g0:before{background:var(--acc)}.g1:before{background:var(--teal)}.g2:before{background:var(--blue)}.g3:before{background:var(--grn)}
.pc .pn{font-weight:700;font-size:17px;padding-right:40px}.pc .pa{font-size:13px;color:var(--muted)}.pc .ev{font-size:13px;margin-top:10px;background:var(--ambbg);color:var(--amb);border-radius:8px;padding:5px 10px;display:inline-block;font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--soft);margin-top:12px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--grn);border-radius:5px;transition:width .6s}
.pc .cnt{position:absolute;right:12px;top:12px;background:var(--acc);color:#0f1111;border-radius:12px;font-weight:800;font-size:13px;padding:2px 9px}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;margin-top:16px;cursor:pointer;min-height:44px;font-weight:600}
.units{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:620px){.units{grid-template-columns:1fr 1fr}}
.unit{border-radius:10px;padding:12px 14px;border:1px solid var(--line);border-left:5px solid;background:var(--card)}.unit.ok{border-left-color:var(--grn)}.unit.warn{border-left-color:#f0a020}.unit.bad{border-left-color:var(--red)}
.unit .un{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.unit .up{font-weight:700}.unit .nt{font-size:13px;margin-top:4px}
.unit .ul{font-size:12px;font-weight:700;float:right;border-radius:10px;padding:2px 8px}.unit.ok .ul{background:var(--grnbg);color:var(--grn)}.unit.warn .ul{background:var(--ambbg);color:var(--amb)}.unit.bad .ul{background:var(--redbg);color:var(--red)}
.task{background:var(--card);border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 12px 12px 10px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}
.tick{flex:0 0 44px;height:44px;border-radius:50%;border:2.5px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tick:hover{border-color:var(--grn)}.task.done .tick{background:var(--grn);border-color:var(--grn);color:#fff}
.tb{flex:1;min-width:0}.tt{font-weight:700}.td{font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word}.td a{color:var(--teal);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.lv{font-size:12px;font-weight:700;border-radius:10px;padding:2px 8px;text-transform:capitalize}.lv.urgent{background:var(--redbg);color:var(--red)}.lv.high{background:var(--ambbg);color:var(--amb)}.lv.normal{background:var(--soft);color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;min-height:34px}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;margin-right:5px;vertical-align:-5px}
.cm{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.cm p{margin:0 0 6px;font-size:13px}.cm form{display:flex;gap:6px}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.btn{border:1px solid var(--acc2);border-radius:20px;padding:10px 18px;background:var(--acc);color:#0f1111;font-weight:700;cursor:pointer;min-height:44px}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chart{display:flex;gap:14px;align-items:flex-end;height:150px;padding:8px 4px 0}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}.pair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.pair i{width:38%;border-radius:4px 4px 0 0;min-height:3px;transition:height .6s}.pair .r{background:var(--teal)}.pair .c{background:var(--acc)}
.col span{font-size:12px;color:var(--muted)}
.list{list-style:none;padding:0;margin:0}.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.list li:first-child{border-top:0}
.amt{font-weight:700;white-space:nowrap}
.act{font-size:14px;padding:10px 0;border-top:1px solid var(--line)}.act:first-child{border-top:0}.act small{color:var(--muted);display:block}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;background:rgba(19,25,33,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:26px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.3);width:calc(100% - 24px);max-width:560px;overflow-x:auto;scrollbar-width:none;border:1px solid rgba(255,255,255,.08)}
.nav::-webkit-scrollbar{display:none}
.nb{flex:1 0 64px;min-height:54px;border:0;background:none;color:#aab0b0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;cursor:pointer;position:relative}
.nb.on{background:var(--acc);color:#0f1111}.nb .n{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:10px;font-size:11px;line-height:16px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--navy2);color:#fff;border-radius:24px;padding:11px 18px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;white-space:nowrap;border-left:4px solid var(--acc)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
#gate{max-width:400px;margin:12vh auto 0;padding:0 18px}
#gate .hero{border-radius:12px;padding:22px 20px;margin-bottom:16px}
#gate form{display:grid;gap:10px}
#err{color:var(--red);font-size:14px;text-align:center;min-height:20px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px;gap:4px;margin-top:16px}.seg button{flex:1;border:0;background:none;border-radius:18px;padding:9px;font-weight:700;cursor:pointer;min-height:40px}.seg .on{background:var(--navy);color:#fff}
.user{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.user:first-child{border-top:0}
.grid2{display:grid;gap:10px}@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
label.ck{display:inline-flex;gap:6px;align-items:center;margin-right:12px;font-size:14px}label.ck input{width:auto;min-height:0;accent-color:var(--acc)}
.amz{position:fixed;left:0;right:0;top:0;bottom:0;z-index:5;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}.amz iframe{border:0;width:100%;height:100%;display:block;background:#eaeded}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.themes{display:flex;gap:6px;margin-top:10px}.themes button{flex:1}
</style>
</head>
<body>
<div id="gate" class="hidden">
  <div class="hero"><div class="logo">eli<i>hub</i></div><div class="sub">Zalo - Sesa - Zugati</div></div>
  <form id="loginf" class="card">
    <input id="em" type="email" autocomplete="username" placeholder="Email" required>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn dark" type="submit">Log in</button>
    <div id="err"></div>
  </form>
</div>
<div id="app" class="hidden"></div>
<nav id="nav" class="nav hidden"></nav>
<div id="toast" class="toast"></div>
<script>
const SB=supabase.createClient('https://kddhkuwnkkjcnbjegsmc.supabase.co','sb_publishable_zASd1ua4ZuknbOatR4MnTA_nVwqRZlR',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">open link</a>');
const gbp=n=>n==null?'-':'£'+Number(n).toLocaleString('en-GB',{maximumFractionDigits:0});
const gbp2=n=>n==null?'-':'£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const dShort=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);if(m<2)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<48)return h+'h ago';return Math.round(h/24)+' days ago'};
const ini=n=>String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',jobs:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',pound:'<path d="M17 20H7c2-2 2-5 1-8h7M6 12h9M16 7a4 4 0 0 0-7 1"/>',act:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',admin:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',tick:'<path d="M5 12l5 5 9-10"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
let ME=null,BIZ=[],CUR=null,TAB='home',PROP=null,D={},PEOPLE=[],OPEN={},JOBF='mine';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function confetti(){const c=['#ff9900','#067d62','#146eb4','#007185','#cc0c39'];for(let i=0;i<40;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.setProperty('--x',(Math.random()*160-80)+'px');e.style.setProperty('--r',(Math.random()*720)+'deg');e.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}}

async function boot(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){$('gate').classList.remove('hidden');$('app').classList.add('hidden');$('nav').classList.add('hidden');return}
  $('gate').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');
  await loadAll();
  if(!BIZ.length){$('app').innerHTML=`<div class="wrap"><div class="card" style="margin-top:20vh"><h2>Nearly there</h2><p>You are logged in, but Eli hasn't given you access to a business yet.</p><button class="btn ghost" onclick="logout()">Log out</button></div></div>`;$('nav').classList.add('hidden');return}
  try{CUR=localStorage.getItem('hubBiz')}catch(e){}
  if(!BIZ.find(b=>b.id===CUR))CUR=BIZ[0].id;
  render();
  SB.channel('hub').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>reload()).on('postgres_changes',{event:'INSERT',schema:'public',table:'task_comments'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'zugati_payments'},()=>reload()).subscribe();
}
let rt;function reload(){clearTimeout(rt);rt=setTimeout(async()=>{await loadAll();if(TAB==='amazon')navBar();else render()},400)}
async function loadAll(){
  const uid=(await SB.auth.getUser()).data.user?.id;
  const [me,biz,props,units,tasks,sum,mm,pays,people,mem,com,zp]=await Promise.all([
    SB.from('profiles').select('*').eq('id',uid).single(),
    SB.from('businesses').select('*').order('sort'),
    SB.from('properties').select('*').eq('archived',false).order('sort'),
    SB.from('units').select('*').order('sort'),
    SB.from('tasks').select('*').order('sort'),
    SB.from('summary').select('*'),
    SB.from('money_months').select('*').order('sort'),
    SB.from('payments').select('*').order('date',{ascending:false}),
    SB.from('profiles').select('id,name,email,role,colour'),
    SB.from('memberships').select('*'),
    SB.from('task_comments').select('*').order('created_at'),
    SB.from('zugati_payments').select('*').order('sort')]);
  ME=me.data;BIZ=biz.data||[];PEOPLE=people.data||[];
  D={props:props.data||[],units:units.data||[],tasks:tasks.data||[],sum:sum.data||[],mm:mm.data||[],pays:pays.data||[],mem:mem.data||[],com:com.data||[],zp:zp.data||[]};
}
const person=id=>PEOPLE.find(p=>p.id===id);
const avatar=p=>p?`<span class="av" style="background:${esc(p.colour||'#F07C8C')}">${esc(ini(p.name))}</span>`:'';
const isAdmin=()=>ME?.role==='admin', isStaff=()=>ME?.role==='staff';
const bizTasks=b=>D.tasks.filter(t=>t.business_id===b);
const openN=ts=>ts.filter(t=>t.status==='open').length;
function render(){
  const b=BIZ.find(x=>x.id===CUR),s=D.sum.find(x=>x.business_id===CUR)||{};
  const ts=bizTasks(CUR),open=openN(ts),done=ts.length-open;
  const h=new Date().getHours(),greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';

  <div class="hi">${greet}, ${esc((ME?.name||'').split(' ')[0])}</div><div style="color:#bdbdc2;position:relative;z-index:1">${open} job${open===1?'':'s'} to go${s.updated_at?' - updated '+ago(s.updated_at):''}</div>

  const f=s.querySelector('form');

    try{if(p)await adminCall({action:'update',id:p.id,name:f.name.value,role:f.role.value,password:f.password.value||undefined,businesses:biz});
      else await adminCall({action:'create',name:f.name.value,email:f.email.value,role:f.role.value,password:f.password.value,businesses:biz,colour:['#F07C8C','#6a4bc4','#1f7a45','#2a63b0','#e0a32e'][PEOPLE.length%5]});
      s.remove();toast('Saved');await loadAll();render()}catch(err){toast(err.message)}};
  const rm=s.querySelector('#rm');if(rm)rm.onclick=async()=>{if(!confirm('Remove '+p.name+'? They will lose access.'))return;try{await adminCall({action:'delete',id:p.id});s.remove();toast('Removed');await loadAll();render()}catch(err){toast(err.message)}}}
function meSheet(){const s=sheet(`<h2 style="margin-top:0">${avatar(ME)}${esc(ME.name)}</h2><div class="card"><div style="color:var(--muted);font-size:13px">${esc(ME.email)} - ${ME.role}</div></div>
  <form class="card" id="pwf"><b>Change my password</b><input name="p" type="password" minlength="8" placeholder="New password (8+ characters)" required style="margin:10px 0"><button class="btn dark">Save password</button></form><div class="card"><b>Look</b><div class="themes"><button class="btn ghost" onclick="setTheme('light');this.closest('.sheet').remove()">Light</button><button class="btn ghost" onclick="setTheme('dark');this.closest('.sheet').remove()">Dark</button><button class="btn ghost" onclick="setTheme('auto');this.closest('.sheet').remove()">Same as phone</button></div></div><button class="btn ghost" onclick="logout()">Log out</button>`);
  s.querySelector('#pwf').onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.updateUser({password:e.target.p.value});toast(error?error.message:'Password changed');if(!error)s.remove()}}
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function setTheme(t){try{if(t==='auto'){localStorage.removeItem('hubTheme');delete document.documentElement.dataset.theme}else{localStorage.setItem('hubTheme',t);document.documentElement.dataset.theme=t}}catch(e){document.documentElement.dataset.theme=t==='auto'?'':t}render()}
function flipTheme(){setTheme(isDark()?'light':'dark')}
async function logout(){await SB.auth.signOut();location.reload()}
$('loginf').onsubmit=async e=>{e.preventDefault();$('err').textContent='';const {error}=await SB.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){$('err').textContent='Wrong email or password';return}boot()};
boot();
</script>
