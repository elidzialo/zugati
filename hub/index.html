<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131921">
<title>Eli Hub</title>
<!-- One login for every hub (22 Nov). Log in with your Eli Hub email, then tap a business.
     The real pages (zalo/, sesa/, the Zugati portal at /) open exactly as they are, already unlocked.
     Keys come from Supabase table portal_keys, which only people with access to that business can read.
     The previous Eli Hub app is kept at hub/app.html. -->
<style>
:root{--bg:#eaeded;--card:#fff;--ink:#0f1111;--muted:#565959;--line:#d5d9d9;--acc:#ff9900;--navy:#232f3e;--navy2:#131921;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--card:#1b232c;--ink:#e9eded;--muted:#a3aaaa;--line:#2c3742;--navy:#1b232c;--navy2:#0b1015;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1418;--card:#1b232c;--ink:#e9eded;--muted:#a3aaaa;--line:#2c3742;--navy:#1b232c;--navy2:#0b1015;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}.hidden{display:none!important}
.hero{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;padding:calc(22px + env(safe-area-inset-top)) 16px 26px;border-bottom:3px solid var(--acc)}
.in{max-width:520px;margin:0 auto}
.logo{font-weight:800;font-size:26px;letter-spacing:-.02em}.logo i{color:var(--acc);font-style:normal}
.sub{color:#c9cccc;font-size:13px;margin-top:4px;font-weight:600}
.hi{font-size:22px;font-weight:700;margin:14px 0 0}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px}
input{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:48px;width:100%;font-size:16px}
.btn{min-height:48px;border-radius:12px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:var(--acc);color:#0f1111}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:600}
#err{color:#cc0c39;font-size:14px;min-height:1em}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;min-height:84px;text-decoration:none;color:inherit;transition:transform .12s}
.tile:active{transform:scale(.98)}
.dot{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
.tile b{display:block;font-size:17px}.tile small{color:var(--muted);font-size:13px}
.tile .go{margin-left:auto;color:var(--muted);font-size:22px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:13px;gap:10px}
.empty{color:var(--muted);text-align:center;padding:20px}
</style>
</head>
<body>
<div class="hero"><div class="in"><div class="logo">eli<i>hub</i></div><div class="sub">Zalo - Sesa - Zugati</div><div class="hi" id="hi"></div></div></div>
<div class="wrap">
 <form id="gate" class="card hidden">
  <input id="em" type="email" autocomplete="username" placeholder="Email" required>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
  <button class="btn" type="submit" id="go">Log in</button>
  <div id="err"></div>
 </form>
 <div id="home" class="hidden">
  <div class="tiles" id="tiles"></div>
  <div class="foot"><span id="who"></span><button class="btn ghost" id="out" style="min-height:40px;padding:0 14px">Log out</button></div>
 </div>
</div>
<script>
const SB='https://kddhkuwnkkjcnbjegsmc.supabase.co',SBK='sb_publishable_zASd1ua4ZuknbOatR4MnTA_nVwqRZlR';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE=location.pathname.replace(/hub\/?(index\.html)?$/,'');
const PAGES={
 zalo:{name:'Zalo Estates',note:'Hawksmoor, Delaval, Vesuvius, Boscombe',url:BASE+'zalo/',col:'#F07C8C'},
 sesa:{name:'Sesa Estates',note:'St Andrews Road South, Castleford HMO',url:BASE+'sesa/',col:'#6a4bc4'},
 zugati:{name:'Zugati',note:'Amazon UK and USA',url:BASE,col:'#ff9900'}};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S=ls.get('hubSess');
function save(t){S={a:t.access_token,r:t.refresh_token,x:t.expires_at||Math.floor(Date.now()/1000)+(t.expires_in||3600),email:t.user?t.user.email:S&&S.email,uid:t.user?t.user.id:S&&S.uid};ls.set('hubSess',S)}
async function auth(body,grant){const r=await fetch(SB+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
async function tok(){if(!S)return null;if(S.x-60>Date.now()/1000)return S.a;try{const t=await auth({refresh_token:S.r},'refresh_token');if(t.access_token){save(t);return S.a}}catch(e){}return null}
async function rest(path){const tk=await tok();if(!tk)throw 0;const r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:SBK,Authorization:'Bearer '+tk}});if(!r.ok)throw 0;return r.json()}
let KEYS={},NAME='';
async function home(){try{
 const [biz,keys,prof]=await Promise.all([rest('businesses?select=id,name&order=sort'),rest('portal_keys?select=business_id,data_key'),rest('profiles?select=name&id=eq.'+S.uid).catch(()=>[])]);
 KEYS={};keys.forEach(k=>KEYS[k.business_id]=k.data_key);NAME=prof[0]&&prof[0].name||S.email;
 $('hi').textContent='Hi '+String(NAME).split(/\s+/)[0];$('who').textContent=S.email;
 const list=biz.filter(b=>PAGES[b.id]);
 $('tiles').innerHTML=list.length?list.map(b=>{const p=PAGES[b.id];return `<button class="tile" data-biz="${esc(b.id)}"><span class="dot" style="background:${p.col}">${esc(p.name[0])}</span><span><b>${esc(p.name)}</b><small>${esc(p.note)}</small></span><span class="go">&rsaquo;</span></button>`}).join(''):'<div class="empty">No businesses on this login yet - ask Eli</div>';
 $('gate').classList.add('hidden');$('home').classList.remove('hidden')}
 catch(e){logout(true)}}
/* Hand the unlock over to the real page through its own "remember me" slot (same site, 7 days) */
function remember(k,pw){ls.set(k,{pw,t:Date.now()})}
async function open_(id){const p=PAGES[id],k=KEYS[id];
 if(id==='zalo'&&k)remember('zaloRemember',k);
 if(id==='zugati'&&k)remember('zugatiRemember',k);
 if(id==='sesa'&&k){ls.set('sesaUser',{email:S.email,name:NAME});remember('sesaPartner',k)}
 location.href=p.url}
async function login(e){e.preventDefault();$('err').textContent='';$('go').disabled=true;
 const em=$('em').value.trim().toLowerCase(),pw=$('pw').value;
 try{const t=await auth({email:em,password:pw},'password');if(!t.access_token)throw 0;save(t);
  /* second session just for the Sesa page (shared ticks, tasks and notes) */
  try{const t2=await auth({email:em,password:pw},'password');if(t2.access_token){ls.set('sesaSess',{a:t2.access_token,r:t2.refresh_token,x:t2.expires_at||Math.floor(Date.now()/1000)+3600})}}catch(x){}
  $('pw').value='';await home()}
 catch(x){$('err').textContent='Wrong email or password.'}$('go').disabled=false}
function logout(quiet){S=null;['hubSess','zaloRemember','zugatiRemember','sesaPartner','sesaRemember','sesaUser','sesaSess'].forEach(ls.del);
 try{sessionStorage.removeItem('zaloPw');sessionStorage.removeItem('sesaPw');sessionStorage.removeItem('zpw')}catch(e){}
 $('home').classList.add('hidden');$('gate').classList.remove('hidden');$('hi').textContent='';if(!quiet)$('em').focus()}
$('gate').onsubmit=login;$('out').onclick=()=>logout();
document.addEventListener('click',e=>{const t=e.target.closest('[data-biz]');if(t)open_(t.dataset.biz)});
if(S)home();else $('gate').classList.remove('hidden');
</script>
</body>
</html>
