<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D1D1F">
<title>Sesa Estates Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ed;--card:#fff;--ink:#1d1d1f;--muted:#6f6d68;--line:#e7e3dc;--soft:#f7f5f1;--pink:#F07C8C;--pinkbg:#fde8eb;--dark:#1D1D1F;
--red:#c2412d;--redbg:#fbe6e1;--amb:#9a5f00;--ambbg:#fdf0d6;--grn:#1f7a45;--grnbg:#e0f3e7;--blue:#2a63b0;--bluebg:#e4eefb;--violet:#6a4bc4;--violetbg:#ece6fb;
--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--ink:#f3f2ef;--muted:#a19f99;--line:#2c2b29;--soft:#242426;--pinkbg:#3a1e23;
--redbg:#3a1c17;--red:#f29a87;--ambbg:#382a10;--amb:#f3c46a;--grnbg:#143022;--grn:#86d6a0;--bluebg:#16263c;--blue:#8fb9f0;--violetbg:#241c3d;--violet:#b8a4f2;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
/* hero */
.hero{background:var(--dark);color:#fff;border-radius:0 0 28px 28px;padding:20px 18px 18px;margin:0 -16px 16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,124,140,.45),transparent 70%)}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand b{font-size:22px;letter-spacing:5px;font-weight:700}.brand b i{color:var(--pink);font-style:normal}
.brand small{display:block;letter-spacing:5px;font-size:12px;color:#9d9d9d}
.upd{font-size:12px;color:#bdbdbd;background:#2b2b2e;border-radius:20px;padding:6px 11px;display:flex;align-items:center;gap:6px}
.upd i{width:7px;height:7px;border-radius:50%;background:#5bd68b;display:block}
.hrow{display:flex;align-items:center;gap:16px;margin-top:16px;position:relative;z-index:1}
.hi{font-size:21px;font-weight:700;line-height:1.25}.hisub{font-size:13px;color:#c9c9c9;margin-top:3px}
.bigring{flex:0 0 auto;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.stat{border-radius:16px;padding:11px 11px 10px;color:#1d1d1f}
.stat .v{font-size:19px;font-weight:700;line-height:1.2}.stat .l{font-size:12px;opacity:.75;font-weight:500}
.s1{background:#c9f0d6}.s2{background:#ffd3da}.s3{background:#d6e4fb}
/* sections */
.sec{animation:rise .3s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:17px;font-weight:700;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2 .cnt{font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.story{background:linear-gradient(135deg,#F07C8C,#f59f7a);color:#fff;border:0;border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(240,124,140,.28)}
.story small{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
.story p{margin:4px 0 0;font-size:19px;font-weight:700;line-height:1.35}
/* top 3 */
.moves{display:grid;gap:10px}
.move{border-radius:20px;padding:14px 12px 14px 16px;display:flex;align-items:center;gap:14px;position:relative;transition:transform .15s,opacity .3s}
.move .num{width:40px;height:40px;border-radius:14px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
.move p{margin:0;font-size:15px;font-weight:600;line-height:1.4;flex:1}
.m1{background:var(--pinkbg)}.m1 .num{background:var(--pink)}.m2{background:var(--bluebg)}.m2 .num{background:var(--blue)}.m3{background:var(--violetbg)}.m3 .num{background:var(--violet)}
.move.done{opacity:.5}.move.done p{text-decoration:line-through}
/* check button */
.chk{width:44px;height:44px;border-radius:50%;border:2px solid rgba(0,0,0,.15);background:var(--card);cursor:pointer;flex:0 0 44px;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0}
.chk svg{opacity:0;transition:opacity .2s}
.done .chk{background:var(--grn);border-color:var(--grn)}.done .chk svg{opacity:1}
.chk:active{transform:scale(.88)}
@media (prefers-color-scheme:dark){.chk{border-color:rgba(255,255,255,.28)}}
.task .chk{align-self:flex-start}
/* watch */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px;line-height:1.45}
.alert .ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--ambbg);color:var(--amb)}
.alert.r .ic{background:var(--redbg);color:var(--red)}
.more{width:100%;margin-top:8px;min-height:44px;border:1px dashed var(--line);background:none;border-radius:16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
/* property cards */
.props{display:grid;gap:12px}
.pc{border-radius:24px;padding:18px;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;border:0;text-align:left;width:100%;display:block}
.pc:active,.move:active{transform:scale(.98)}
.pc:after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.pc .row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.pc .pn{font-size:18px;font-weight:700;line-height:1.25}.pc .pa{font-size:13px;opacity:.88}
.pc .go{margin-left:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.pbar{height:10px;border-radius:8px;background:rgba(255,255,255,.28);margin:14px 0 8px;overflow:hidden;position:relative;z-index:1}.pbar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600;position:relative;z-index:1;align-items:center}
.chip{background:rgba(255,255,255,.22);border-radius:20px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.faces{display:flex;gap:4px;margin-left:auto}
.g0{background:linear-gradient(135deg,#F07C8C,#f5a07c)}.g1{background:linear-gradient(135deg,#4c7de0,#6a4bc4)}.g2{background:linear-gradient(135deg,#2f9a63,#1f7a45)}.g3{background:linear-gradient(135deg,#d48a1c,#b8641a)}
.mt{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);width:100%;text-align:left}
.mt .ic{width:46px;height:46px;border-radius:15px;background:var(--grnbg);color:var(--grn);display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.mt .v{font-size:22px;font-weight:700;color:var(--grn);line-height:1.1}.mt .l{font-size:13px;color:var(--muted)}
.spark{margin-left:auto;display:flex;gap:7px;align-items:flex-end;height:52px}.spark span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:12px;font-weight:600;color:var(--muted)}.spark i{width:16px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#5bd68b,var(--grn));display:block;min-height:4px;max-height:34px}.spark .pt i{opacity:.55}
/* money */
.mhero{background:linear-gradient(135deg,#1f7a45,#2fa463);color:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 24px rgba(31,122,69,.25)}
.mhero .l{font-size:13px;opacity:.9;font-weight:500}.mhero .big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.bars{display:flex;gap:12px;align-items:flex-end;height:130px;margin:16px 2px 4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bpair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bpair i{display:block;width:40%;max-width:30px;border-radius:8px 8px 3px 3px;transition:height .8s cubic-bezier(.2,.8,.2,1);height:0}
.bpair i.r{background:#fff}.bpair i.c{background:rgba(255,255,255,.3)}
.bar span{font-size:12px;opacity:.9}.bar b{font-size:12px;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;opacity:.9}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;background:rgba(255,255,255,.55)}
.tile b{font-size:20px;font-weight:700;line-height:1.2}.tile span{font-size:12px;font-weight:500;opacity:.8}
.tb{background:var(--bluebg);color:var(--blue)}.tp{background:var(--pinkbg);color:#b34657}
@media (prefers-color-scheme:dark){.tp{color:var(--pink)}.tile .ic{background:rgba(255,255,255,.08)}}
.wait{display:grid;gap:8px}
.wc{display:flex;gap:12px;background:var(--ambbg);color:var(--ink);border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.45}
.wc .ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:rgba(255,255,255,.6);color:var(--amb);display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){.wc .ic{background:rgba(255,255,255,.08)}}
.wc b{display:block;color:var(--amb);font-weight:700}
.pays{display:grid;gap:8px}
.pay{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.pay .ic{width:40px;height:40px;border-radius:13px;background:var(--grnbg);color:var(--grn);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.pay .amt{margin-left:auto;font-weight:700;color:var(--grn);font-size:16px;white-space:nowrap}.pay .w{font-size:14px;font-weight:600}.pay .d{font-size:12px;color:var(--muted)}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{flex:0 0 132px}
.dl{flex:1;display:grid;gap:7px;font-size:13px;min-width:0}.dl div{display:flex;align-items:center;gap:8px}.dl i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}.dl b{margin-left:auto;font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
/* property page */
.pban{border-radius:26px;padding:18px;color:#fff;position:relative;overflow:hidden}
.pban:after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.pban .t{font-size:21px;font-weight:700;line-height:1.25;position:relative;z-index:1}.pban .a{font-size:13px;opacity:.88;position:relative;z-index:1}
.pban .s{font-size:14px;margin-top:10px;position:relative;z-index:1;line-height:1.45}
.pban .ev{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border-radius:14px;padding:8px 12px;font-size:13px;margin-top:12px;font-weight:600;position:relative;z-index:1}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.pstats div{background:rgba(255,255,255,.2);border-radius:14px;padding:9px 10px}.pstats b{display:block;font-size:20px;line-height:1.2}.pstats span{font-size:12px;opacity:.9}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:16px 2px 8px}
.lvl i{width:10px;height:10px;border-radius:50%}
.tasks{display:grid;gap:8px}
.task{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 16px;box-shadow:var(--shadow);transition:opacity .3s,transform .2s;position:relative;overflow:hidden}
.task:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.urgent:before{background:var(--red)}.high:before{background:#e3a32e}.normal:before{background:var(--line)}
.task .tx{flex:1;min-width:0}.task b{font-weight:600;font-size:14px;display:block;line-height:1.4}.task span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.task.done{opacity:.5}.task.done b{text-decoration:line-through}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.task .av{color:#fff;display:inline-flex;margin:0;font-size:12px}
.own,.nudge{min-height:44px;border-radius:20px;border:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;padding:4px 14px 4px 6px;cursor:pointer;position:relative}
.own.none{padding-left:12px;color:var(--muted);border-style:dashed;background:none}
.nudge{background:var(--pinkbg);border-color:transparent;color:#b34657;padding-left:10px}
@media (prefers-color-scheme:dark){.nudge{color:var(--pink)}}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 28px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 2px;font-size:17px}.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 12px;margin-bottom:8px;cursor:pointer;text-align:left;font-size:15px;font-weight:600}
.pick small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick .av{width:38px;height:38px;flex:0 0 38px;font-size:14px}
.other{display:grid;gap:8px;margin-top:6px}
.other input{font:16px Poppins,sans-serif;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:48px;width:100%}
.btn{min-height:48px;border-radius:14px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:var(--dark);color:#fff}
@media (prefers-color-scheme:dark){.btn{background:#fff;color:#1d1d1f}}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.alldone{text-align:center;padding:22px 16px;border-radius:20px;background:var(--grnbg);color:var(--grn);font-weight:700}
.alldone small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.u{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.uh{display:flex;gap:12px;align-items:center}
.un{font-weight:700;font-size:15px;line-height:1.3}.ut{font-size:13px;color:var(--muted)}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.ok{background:var(--grnbg);color:var(--grn)}.warn{background:var(--ambbg);color:var(--amb)}.bad{background:var(--redbg);color:var(--red)}
.unote{font-size:13px;margin-top:10px;line-height:1.5;color:var(--ink);background:var(--soft);border-radius:12px;padding:9px 11px}
/* D 18 Nov 12:47: richer unit cards - status band, mini timeline, fold-out note */
.umix{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.umix .mixb{display:flex;flex-direction:row;height:12px;border-radius:8px;overflow:hidden;gap:3px}.umix .mixb i{display:block;border-radius:8px;transition:flex-grow .6s ease}
.umix .lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:13px;font-weight:600}.umix .lg span{display:flex;align-items:center;gap:6px}.umix .lg b{width:10px;height:10px;border-radius:50%;display:block}
.u2{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.u2 .band{display:flex;gap:12px;align-items:center;padding:13px 14px;position:relative}
.u2.s-ok .band{background:linear-gradient(135deg,var(--grnbg),var(--card))}.u2.s-warn .band{background:linear-gradient(135deg,var(--ambbg),var(--card))}.u2.s-bad .band{background:linear-gradient(135deg,var(--redbg),var(--card))}
.u2 .band:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.u2.s-ok .band:before{background:var(--grn)}.u2.s-warn .band:before{background:#e3a32e}.u2.s-bad .band:before{background:var(--red)}
.u2 .tag{border:1px solid currentColor}
.av{width:26px;height:26px;border-radius:50%;background:var(--dark);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;flex:0 0 26px}
@media (prefers-color-scheme:dark){.av{background:#fff;color:#1d1d1f}}
.ut2{display:flex;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.tl{padding:6px 14px 2px}
.tl .ln{display:flex;align-items:flex-start;position:relative;gap:4px}
.tl .ln:before{content:"";position:absolute;left:12px;right:12px;top:6px;height:2px;background:var(--line)}
.tl .pt{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.tl .pt i{width:14px;height:14px;border-radius:50%;display:block;background:var(--muted);border:3px solid var(--card);box-sizing:content-box;margin-top:-3px}
.tl .pt.fu i{background:var(--card);box-shadow:inset 0 0 0 3px var(--pink)}
.tl .pt.td i{background:var(--pink);animation:tdp 1.6s ease-in-out infinite}
@keyframes tdp{0%,100%{box-shadow:0 0 0 0 rgba(240,124,140,.5)}50%{box-shadow:0 0 0 6px rgba(240,124,140,0)}}
.tl .pt span{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px;white-space:nowrap}
.tl .pt.td span,.tl .pt.fu span{color:var(--pink)}
.nx{display:inline-flex;align-items:center;gap:6px;margin:8px 14px 0;align-self:flex-start;font-size:12px;font-weight:700;background:var(--pinkbg);color:#b8435a;border-radius:20px;padding:4px 10px}
@media (prefers-color-scheme:dark){.nx{color:var(--pink)}}
.u2 details{margin:10px 14px 14px}
.u2 summary{list-style:none;cursor:pointer;font-size:13px;line-height:1.5;background:var(--soft);border-radius:12px;padding:9px 11px;min-height:44px}
.u2 summary::-webkit-details-marker{display:none}
.u2 summary .cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u2 summary em{font-style:normal;font-weight:700;color:var(--pink);font-size:12px}
.u2 details[open] .cl{-webkit-line-clamp:unset;display:block}
.u2 details[open] em{display:none}
@media (prefers-reduced-motion:reduce){.tl .pt.td i{animation:none}}
.pop{animation:pop .35s ease}@keyframes pop{40%{transform:scale(1.03)}}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;background:rgba(29,29,31,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:26px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:calc(100% - 24px);max-width:520px}
.nb{flex:1;min-height:54px;border:0;background:none;color:#a9a9ad;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;cursor:pointer;position:relative;padding:4px 2px;min-width:0}
.nb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb.on{background:#fff;color:#1d1d1f}
.nb .n{position:absolute;top:4px;right:calc(50% - 22px);background:var(--pink);color:#fff;border-radius:10px;font-size:12px;line-height:17px;padding:0 5px;min-width:17px;font-weight:700}
/* toast, confetti */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#fff;color:#1d1d1f;border-radius:24px;padding:11px 18px;font:600 14px Poppins,sans-serif;opacity:0;transition:all .25s ease;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:fall 1.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
/* gate */
#gate{max-width:380px;margin:14vh auto 0;padding:0 18px}
#gate .hero{border-radius:24px;margin:0 0 16px;padding:24px 20px}
#gate .hi{margin-top:18px;position:relative;z-index:1}
#gate input{width:100%;font:16px Poppins,sans-serif;padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:0 0 10px}
#gate button{width:100%;font:600 16px Poppins,sans-serif;padding:15px;border-radius:16px;border:0;background:var(--pink);color:#fff;cursor:pointer;min-height:52px}
#err{color:var(--red);font-size:14px;text-align:center}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hidden{display:none!important}
@media (min-width:760px){.props{grid-template-columns:1fr 1fr}.moves{grid-template-columns:repeat(3,1fr)}.move{flex-direction:column;align-items:flex-start}.move .chk{align-self:flex-end}.alerts{grid-template-columns:1fr 1fr}.pays,.wait{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* A2 18 Nov: rent by property + in vs out */
.io{margin-top:10px}.io .ttl{font-size:15px;font-weight:700;margin-bottom:10px}
.io .sbar{display:flex;height:22px;border-radius:12px;overflow:hidden;background:var(--line)}
.io .sbar i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.io .sbar .r{background:var(--grn)}.io .sbar .c{background:var(--pink)}
.io .lg{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--muted)}.io .lg b{color:var(--ink);font-size:16px}
.io .say{margin-top:10px;font-size:15px;line-height:1.4}
.rp{display:grid;gap:10px}
.rpc{border-radius:20px;padding:14px 16px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:0;text-align:left;font:inherit;cursor:pointer;width:100%}
.rpc .n{font-weight:700;font-size:16px}.rpc .v{font-size:24px;font-weight:800;text-align:right}
.rpc .m{font-size:13px;opacity:.92;grid-column:1/-1}
.rpc .tr{grid-column:1/-1;height:8px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}.rpc .tr i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rpc.zero{background:var(--card)!important;color:var(--ink);border:2px dashed var(--red)}.rpc.zero .v{color:var(--red)}.rpc.zero .tr{background:var(--redbg)}
.rentchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:12px;padding:5px 10px;font-size:13px;font-weight:600;margin-top:8px}

/* D 18 Nov: weekly streak + points */
.streak{border-radius:24px;padding:16px;background:linear-gradient(135deg,#fff3d6,#ffe1c2);color:#1d1d1f;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(227,163,46,.18)}
.streak:after{content:"";position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.45)}
.sk-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.flame{width:52px;height:52px;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 52px;box-shadow:0 4px 12px rgba(227,100,46,.18)}
.flame.off{filter:grayscale(1);opacity:.55}
.flame.lit svg{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}@keyframes flick{50%{transform:scale(1.08) rotate(-3deg)}}
.sk-n{font-size:22px;font-weight:800;line-height:1.1}.sk-l{font-size:13px;font-weight:500;color:#6b5320}
.pts{margin-left:auto;background:#1d1d1f;color:#fff;border-radius:16px;padding:7px 12px;text-align:center;line-height:1.1}
.pts b{display:block;font-size:18px;font-weight:800;color:#ffcf5c}.pts span{font-size:12px;font-weight:600;opacity:.8}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;position:relative;z-index:1;max-width:440px}
.dy{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#7a6638}
.dy i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:#b07a10;border:2px solid transparent}
.dy.on i{background:linear-gradient(135deg,#ff9a3c,#F07C8C);color:#fff}
.dy.today i{border-color:#1d1d1f}.dy.today:not(.on) i{animation:nudgeDot 2s ease-in-out infinite}@keyframes nudgeDot{50%{box-shadow:0 0 0 5px rgba(240,124,140,.35)}}.dy.fut i{opacity:.45}
.goal{margin-top:14px;position:relative;z-index:1}
.goal .gt{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.goal .gb{height:14px;border-radius:10px;background:rgba(255,255,255,.75);overflow:hidden}
.goal .gb i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#ff9a3c,#F07C8C);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.goal.won .gb i{background:linear-gradient(90deg,#2f9a63,#5bd68b)}
@media (prefers-color-scheme:dark){.streak{background:linear-gradient(135deg,#3a2a10,#3a1f1c);color:#f3f2ef;box-shadow:none}.streak:after{background:rgba(255,255,255,.05)}
.flame{background:#2a2a2c}.sk-l,.dy{color:#e3c78a}.dy i{background:rgba(255,255,255,.1);color:#f3c46a}.dy.today i{border-color:#fff}.goal .gb{background:rgba(255,255,255,.12)}.pts{background:#fff;color:#1d1d1f}.pts b{color:#d4800c}}
</style>
</head>
<body>
<div id="gate">
  <div class="hero"><div class="brand"><b>SESA<i>.</i></b><small>ESTATES HUB</small></div><div class="hi">Your properties,<br>one tap away</div></div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">Open hub</button>
  <p id="err" class="hidden">Wrong password, or the data could not be loaded.</p>
</div>
<div id="app" class="wrap hidden"></div>
<nav id="nav" class="nav hidden" aria-label="Sections"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="shade" class="shade hidden"></div>
<script>
let DATA,KEY,TAB='home';
const GR=['g0','g1','g2','g3'];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp=(n,dp)=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:dp??0,maximumFractionDigits:dp??0});
const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 pound:'<path d="M17 20H7c2-2 2-4 2-7V8a4 4 0 0 1 7.5-2M6 13h8"/>',
 bld:'<path d="M4 21V5l8-3 8 3v16M9 21v-4h6v4M8 8h1M15 8h1M8 12h1M15 12h1"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
 alert:'<path d="M12 3l9.5 17h-19zM12 10v4M12 17.5v.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 bank:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',
 arrow:'<path d="M9 5l7 7-7 7"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 in:'<path d="M12 4v13M6 11l6 6 6-6M5 21h14"/>',
 out:'<path d="M12 20V7M6 13l6-6 6 6M5 3h14"/>'};
const ic=(n,s=18,w=2.2,col='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
function face(tag,s=40){const c=tag==='ok'?['var(--grnbg)','var(--grn)']:tag==='bad'?['var(--redbg)','var(--red)']:['var(--ambbg)','var(--amb)'];
 const m=tag==='ok'?'M14 26q6 6 12 0':tag==='bad'?'M14 29q6-6 12 0':'M14 27h12';
 return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true" style="flex:0 0 ${s}px"><circle cx="20" cy="20" r="20" fill="${c[0]}"/><circle cx="14.5" cy="16" r="2.4" fill="${c[1]}"/><circle cx="25.5" cy="16" r="2.4" fill="${c[1]}"/><path d="${m}" fill="none" stroke="${c[1]}" stroke-width="2.6" stroke-linecap="round"/></svg>`}
function mini(tag){const m=tag==='ok'?'M7 13q5 4 10 0':tag==='bad'?'M7 16q5-4 10 0':'M7 14h10';return `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(255,255,255,.9)"/><circle cx="8.5" cy="9.5" r="1.5" fill="#1d1d1f"/><circle cx="15.5" cy="9.5" r="1.5" fill="#1d1d1f"/><path d="${m}" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/></svg>`}
let OWN={},EXTRA=[];try{OWN=JSON.parse(localStorage.getItem('sesaOwners')||'{}');EXTRA=JSON.parse(localStorage.getItem('sesaPeople')||'[]')}catch(e){}
function saveOwn(){try{localStorage.setItem('sesaOwners',JSON.stringify(OWN));localStorage.setItem('sesaPeople',JSON.stringify(EXTRA))}catch(e){}}
const PCOL=['#F07C8C','#4c7de0','#6a4bc4','#2f9a63','#d48a1c','#1d1d1f'];
const people=()=>[...(DATA.people||[]),...EXTRA.filter(x=>!(DATA.people||[]).some(p=>p.id===x.id))];
const person=id=>people().find(p=>p.id===id);
const ownerId=t=>(t.id in OWN)?OWN[t.id]:t.owner;
const me=()=>(DATA.people||[]).find(p=>p.me);
const inits=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const pcol=id=>{const i=people().findIndex(p=>p.id===id);return PCOL[(i<0?5:i)%PCOL.length]};
const avatar=(p,cls='av')=>`<span class="${cls}" style="background:${pcol(p.id)}">${esc(inits(p.name))}</span>`;
const first=n=>String(n||'').split(/\s+/)[0];
let DONE={};try{DONE=JSON.parse(localStorage.getItem('sesaDone')||'{}')}catch(e){}
function saveDone(){try{localStorage.setItem('sesaDone',JSON.stringify(DONE))}catch(e){}}
async function deriveKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function load(pw){const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});const e=await r.json();if(!KEY||pw)KEY=await deriveKey(pw,b64(e.salt),e.iter);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},KEY,b64(e.ct));DATA=JSON.parse(new TextDecoder().decode(p));norm(DATA);render()}
function norm(d){d.properties=d.properties||[];d.top3=d.top3||[];d.watch=d.watch||[];d.properties.forEach(p=>{p.units=p.units||[];p.tasks=p.tasks||[];p.name=p.name||'Property'});if(d.money){const m=d.money;m.months=m.months||[];m.payments=m.payments||[];m.costs_top=m.costs_top||[];m.expected=m.expected||[]}}
async function go(){const pw=document.getElementById('pw').value;document.getElementById('err').classList.add('hidden');
 try{await load(pw);try{sessionStorage.setItem('sesaPw',pw)}catch(e){}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('nav').classList.remove('hidden')}
 catch(e){KEY=null;document.getElementById('err').classList.remove('hidden');const g=document.getElementById('pw');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}}
function ago(t){const m=Math.round((Date.now()-new Date(t))/60000);if(!isFinite(m))return 'recently';if(m<2)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<48)return h+'h ago';return Math.round(h/24)+' days ago'}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
const short=n=>String(n).replace(/^\d+\s*/,'').replace(/ Road South$/,'').replace(/ HMO$/,'');
const open_=p=>p.tasks.filter(t=>!DONE[t.id]).length;
const allT=()=>DATA.properties.reduce((a,p)=>a+p.tasks.length,0),allO=()=>DATA.properties.reduce((a,p)=>a+open_(p),0);
const t3left=()=>DATA.top3.slice(0,3).filter(x=>!DONE[hash(x)]).length;
const subline=o=>o?`${o} jobs to go across ${DATA.properties.length} ${DATA.properties.length===1?'property':'properties'}`:'Everything ticked off. Legend.';
function ring(d,t,sz,stroke,col,track,txt){const r=(sz-stroke)/2,C=2*Math.PI*r,f=t?d/t:0;
 return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img" aria-label="${d} of ${t} done"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 ${sz/2} ${sz/2})"/>${txt||''}</svg>`}
function heroRing(){const t=allT(),d=t-allO(),s=78;return ring(d,t,s,8,'#F07C8C','#333336',`<text x="${s/2}" y="${s/2+2}" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">${t?Math.round(d/t*100):0}%</text><text x="${s/2}" y="${s/2+17}" text-anchor="middle" font-size="12" fill="#bbb">${d?'done':'let\'s go'}</text>`)}
function setTab(t){TAB=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return 't3_'+(h>>>0).toString(36)}
const tickIcon=()=>ic('check',20,3,'#fff');
/* D 18 Nov: streak + points. Tick times per device in localStorage 'sesaLog' */
let LOG={};try{LOG=JSON.parse(localStorage.getItem('sesaLog')||'{}')}catch(e){}
function saveLog(){try{localStorage.setItem('sesaLog',JSON.stringify(LOG))}catch(e){}}
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function ptsFor(k){if(String(k).startsWith('t3_'))return 15;const[t]=findTask(k);return t?(t.level==='urgent'?30:t.level==='high'?20:10):10}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function streakStats(){const days={};let wk=0,pts=0;const ws=weekStart();
 for(const[k,ts]of Object.entries(LOG)){if(!DONE[k])continue;const d=new Date(ts);if(isNaN(d))continue;days[dkey(d)]=1;if(d>=ws){wk++;pts+=ptsFor(k)}}
 const c=new Date();c.setHours(0,0,0,0);if(!days[dkey(c)])c.setDate(c.getDate()-1);let st=0;while(days[dkey(c)]){st++;c.setDate(c.getDate()-1)}
 const total=allT()+Math.min(3,DATA.top3.length),goal=Math.max(3,Math.min(10,total));return{days,wk,pts,st,goal,ws}}
const FLAME='<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5.5 6 5.5 11.2A5.5 5.5 0 0 1 12 22a5.5 5.5 0 0 1-5.5-5.6c0-2.7 1.6-4.2 2.6-5.4.4 1.6 1.2 2.6 2.2 3C10.6 10.6 11 6 12 2z" fill="#ff8a3c"/><path d="M12 12.5c.6 1.7 2.7 2.7 2.7 5a2.7 2.7 0 0 1-5.4 0c0-1.3.8-2.1 1.4-2.8.2.8.6 1.2 1 1.4-.3-1.4 0-2.7.3-3.6z" fill="#ffd36b"/></svg>';
function streakCard(){const s=streakStats(),t=dkey(new Date()),L=['M','T','W','T','F','S','S'];
 const head=s.st?`<div class="sk-n">${s.st} day streak</div><div class="sk-l">${s.wk} cleared this week</div>`:s.wk?`<div class="sk-n">${s.wk} cleared this week</div><div class="sk-l">Tick one today to keep it lit</div>`:`<div class="sk-n">Start a streak</div><div class="sk-l">Tick a job to light it</div>`;
 const wk=L.map((l,i)=>{const d=new Date(s.ws);d.setDate(d.getDate()+i);const k=dkey(d),on=s.days[k],fut=k>t;return `<div class="dy ${on?'on':''} ${k===t?'today':''} ${fut?'fut':''}"><i>${on?'✓':d.getDate()}</i>${l}</div>`}).join('');
 const pc=Math.min(100,Math.round(s.wk/s.goal*100)),won=s.wk>=s.goal;
 return `<div class="sk-top"><div class="flame ${s.st?'lit':'off'}">${FLAME}</div><div>${head}</div><div class="pts"><b>${s.pts}</b><span>pts</span></div></div>
 <div class="week" aria-label="This week">${wk}</div>
 <div class="goal ${won?'won':''}"><div class="gt"><span>${won?'Weekly goal smashed!':'Weekly goal'}</span><span>${Math.min(s.wk,s.goal)}/${s.goal}</span></div><div class="gb"><i data-w="${pc}" style="width:0"></i></div></div>`}
function refreshStreak(){const e=document.getElementById('streak');if(!e)return;e.innerHTML=streakCard();requestAnimationFrame(()=>e.querySelectorAll('[data-w]').forEach(x=>x.style.width=x.dataset.w+'%'))}
/* ---------- views ---------- */
function home(d){let h='';
 h+=`<div class="story"><small>Today's story</small><p>${esc(d.headline||'All quiet. Nice.')}</p></div>`;
 if(d.top3.length){h+=`<h2>Your 3 things today <span class="cnt" id="t3c">${t3left()} left</span></h2><div class="moves">${d.top3.slice(0,3).map((x,i)=>{const k=hash(x);return `<div class="move m${i+1} ${DONE[k]?'done':''}"><div class="num">${i+1}</div><p>${esc(x)}</p><button class="chk" data-t3="${k}" aria-label="Mark done">${tickIcon()}</button></div>`}).join('')}</div>`}
 h+=`<h2>Your week</h2><div class="streak" id="streak">${streakCard()}</div>`;
 if(d.properties.length){h+=`<h2>Properties</h2><div class="props">`;
  d.properties.forEach((p,i)=>{const t=p.tasks.length,dn=t-open_(p),att=p.units.filter(u=>u.tag!=='ok').length;
   h+=`<button class="pc ${GR[i%4]}" data-tab="${esc(p.id)}"><div class="row"><div><div class="pn">${esc(p.name)}</div><div class="pa">${esc(p.area||'')}</div></div><div class="go">${ic('arrow',18,2.6)}</div></div>
   <div class="pbar"><i style="width:${t?Math.round(dn/t*100):0}%"></i></div>
   <div class="pmeta"><span class="chip">${ic('check',14,3)} ${dn}/${t} jobs</span>${att?`<span class="chip">${att} need a look</span>`:''}${p.units.length?`<span class="faces">${p.units.map(u=>mini(u.tag)).join('')}</span>`:''}</div></button>`});
  h+=`</div>`}
 if(d.money){const ms=d.money.months,mx=Math.max(...ms.map(x=>x.rent||0),1);
  h+=`<h2>Money</h2><button class="mt" data-tab="money"><div class="ic">${ic('pound',24,2.4)}</div><div><div class="v">${gbp(d.money.rent_total)}</div><div class="l">Rent in since Sep</div></div><div class="spark" aria-hidden="true">${ms.map(x=>`<span class="${x.partial?'pt':''}"><i style="height:${Math.max(4,Math.round((x.rent||0)/mx*34))}px"></i>${esc(String(x.m||'').charAt(0))}</span>`).join('')}</div></button>`}
 if(d.watch.length){const n=d.watch.length;

function rentOf(p){const m=DATA.money;if(!m||!m.payments)return{sum:0,n:0,last:null};const k=short(p.name).toLowerCase();const ps=m.payments.filter(x=>String(x.property||'').toLowerCase().includes(k));

 h+=`<div class="mhero"><div class="l">Rent received since Sep</div><div class="big" data-count="${Number(m.rent_total)||0}">${gbp(m.rent_total)}</div>

 {const r=+m.rent_total||0,c=+m.costs_total||0,t=(r+c)||1,net=r-c;
 h+=`<div class="card io"><div class="ttl">Money in vs money out since Sep</div><div class="sbar"><i class="r" data-w="${Math.round(r/t*100)}" style="width:0"></i><i class="c" data-w="${Math.round(c/t*100)}" style="width:0"></i></div>

 if(DATA.properties.length){const rs=DATA.properties.map(p=>[p,rentOf(p)]),mx=Math.max(...rs.map(x=>x[1].sum),1);
 h+=`<h2>Rent by property</h2><div class="rp">${rs.map(([p,x],i)=>`<button class="rpc ${GR[i%4]} ${x.sum?'':'zero'}" data-tab="${esc(p.id)}"><div class="n">${esc(short(p.name))}</div><div class="v">${gbp(x.sum)}</div><div class="tr"><i data-w="${Math.max(x.sum?6:0,Math.round(x.sum/mx*100))}" style="width:0"></i></div><div class="m">${x.sum?`${x.n} payment${x.n>1?'s':''} since Sep - last on ${esc(dShort(x.last))}`:'No rent in yet - worth chasing'}</div></button>`).join('')}</div>`}

 if(m.costs_top.length){const cols=['#F07C8C','#4c7de0','#6a4bc4','#e3a32e','#2f9a63','#8a8a8a'],tot=m.costs_top.reduce((a,c)=>a+(+c[1]||0),0)||1,R=52,C=2*Math.PI*R;let off=0;
  const arcs=m.costs_top.map((c,i)=>{const len=(+c[1]||0)/tot*C,s=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${cols[i%6]}" stroke-width="20" stroke-dasharray="${Math.max(len-2,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;off+=len;return s}).join('');

  <div class="dl">${m.costs_top.map((c,i)=>`<div><i style="background:${cols[i%6]}"></i><span>${esc(c[0])}</span><b>${gbp(c[1])}</b></div>`).join('')}</div></div>`}

const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function tagOf(u){return ['ok','warn','bad'].includes(u.tag)?u.tag:'warn'}
function noteDates(n){const base=new Date(DATA.updated_at||Date.now());const out={};const add=d=>{d.setHours(0,0,0,0);out[d.getTime()]=d};
 const re=/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/gi;let m;
 while((m=re.exec(n))){const d=new Date(base.getFullYear(),MON.indexOf(m[2].toLowerCase()),+m[1]);if(d-base>180*864e5)d.setFullYear(d.getFullYear()-1);else if(base-d>180*864e5)d.setFullYear(d.getFullYear()+1);add(d)}
 if(/\b(tonight|today)\b/i.test(n))add(new Date(base));
 return Object.values(out).sort((a,b)=>a-b).slice(-4)}
function tlHtml(ds){if(ds.length<2)return '';const t0=new Date();t0.setHours(0,0,0,0);
 return `<div class="tl"><div class="ln">${ds.map(d=>{const c=+d===+t0?'td':d>t0?'fu':'pa';return `<div class="pt ${c}"><i></i><span>${c==='td'?'Today':dShort(d)}</span></div>`}).join('')}</div></div>`}
function nextUp(ds){const t0=new Date();t0.setHours(0,0,0,0);const f=ds.find(d=>d>=t0);if(!f)return '';const n=Math.round((f-t0)/864e5);
 return `<span class="nx">${ic('cal',14,2.4)} ${n===0?'Today':n===1?'Tomorrow':`In ${n} days - ${f.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}`}</span>`}
function initials(s){const w=String(s||'').replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()}
function unitCard(u){const tg=tagOf(u),ds=u.note?noteDates(u.note):[];
 return `<div class="u2 s-${tg}"><div class="band">${face(tg,44)}<div style="min-width:0"><div class="un">${esc(u.name)}</div>${u.tenant?`<div class="ut2"><span class="av">${esc(initials(u.tenant))}</span>${esc(u.tenant)}</div>`:''}</div>${u.label?`<span class="tag ${tg}">${esc(u.label)}</span>`:''}</div>${tlHtml(ds)}${nextUp(ds)}${u.note?`<details><summary><span class="cl">${esc(u.note)}</span>${u.note.length>110?'<em>Tap to read more</em>':''}</summary></details>`:''}</div>`}
function unitMix(us){const c={ok:0,warn:0,bad:0};us.forEach(u=>c[tagOf(u)]++);const L=[['ok','All good','var(--grn)'],['warn','Waiting','#e3a32e'],['bad','Problem','var(--red)']];
 return `<div class="umix"><div class="mixb">${L.filter(x=>c[x[0]]).map(x=>`<i style="flex:${c[x[0]]} 1 0;background:${x[2]}"></i>`).join('')}</div><div class="lg">${L.filter(x=>c[x[0]]).map(x=>`<span><b style="background:${x[2]}"></b>${c[x[0]]} ${x[1].toLowerCase()}</span>`).join('')}</div></div>`}
function prop(p,i){let h='';const t=p.tasks.length,o=open_(p),att=p.units.filter(u=>u.tag!=='ok').length;

 <div class="pstats"><div><b id="po">${o}</b><span>Jobs left</span></div><div><b>${p.units.length}</b><span>Units</span></div><div><b>${att}</b><span>Need a look</span></div></div></div>`;

function render(){const d=DATA,o=allO();let h='';

function tick(key,el,kind){const wk0=streakStats().wk;DONE[key]=!DONE[key];if(!DONE[key]){delete DONE[key];delete LOG[key]}else LOG[key]=new Date().toISOString();saveDone();saveLog();refreshStreak();const row=el.closest(kind==='t3'?'.move':'.task');row.classList.toggle('done',!!DONE[key]);row.classList.remove('pop');void row.offsetWidth;row.classList.add('pop');refresh();
